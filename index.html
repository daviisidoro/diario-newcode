<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEW CODE - Diário Escolar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'nc-dark': '#0f172a',
                        'nc-panel': '#1e293b',
                        'nc-blue': '#152238',
                        'nc-light-blue': '#6ba4c6',
                        'nc-header': '#1A2E4C',
                        'nc-accent': '#6ba4c6',
                        'nc-row-alt': '#f8fafc',
                        'nc-row-alt-dark': '#1e293b',
                        'nc-green-header': '#4b7b4b',
                        'nc-green-cell': '#d3ecd3',
                        'nc-green-cell-dark': '#14532d',
                        'nc-red-header': '#b05b45',
                        'nc-red-cell': '#f5d5d5',
                        'nc-red-cell-dark': '#7f1d1d',
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            background-color: #0f172a; 
            color: #e2e8f0;
        }
        .tab-active { 
            border-bottom: 2px solid #6ba4c6; 
            color: #6ba4c6; 
            font-weight: 600; 
        }
        .tab-inactive {
            color: #94a3b8;
        }
        .tab-inactive:hover {
            color: #e2e8f0;
        }
        .select-status { 
            appearance: none; 
            background-color: transparent; 
            border: none; 
            width: 100%; 
            height: 100%; 
            text-align: center; 
            font-weight: 700; 
            cursor: pointer; 
            outline: none; 
        }
        .status-p { color: #4ade80; } 
        .status-f { color: #f87171; }
        
        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 50;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            min-width: 250px;
            padding: 12px 20px;
            border-radius: 6px;
            color: white;
            font-weight: 500;
            font-size: 14px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            opacity: 0;
            transform: translateX(100%);
            animation: slideIn 0.3s forwards;
        }
        .toast.erro { background-color: #b05b45; }
        .toast.sucesso { background-color: #4b7b4b; }
        .toast.aviso { background-color: #d97706; }
        
        @keyframes slideIn {
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes fadeOut {
            to { opacity: 0; }
        }

        /* Loading spinner */
        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-left-color: #6ba4c6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="antialiased">

    <div id="toast-container"></div>

    <!-- TELA DE LOADING INICIAL -->
    <div id="tela-loading" class="min-h-screen flex items-center justify-center p-4">
        <div class="loader w-12 h-12"></div>
    </div>

    <!-- TELA DE LOGIN / CADASTRO -->
    <div id="tela-auth" class="min-h-screen flex items-center justify-center p-4 hidden">
        <div class="bg-nc-header rounded-lg shadow-xl w-full max-w-md overflow-hidden border border-gray-700">
            <div class="text-center py-8 bg-nc-dark border-b-4 border-nc-accent relative">
                <div class="inline-block bg-nc-accent p-3 rounded-lg mb-4">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
                </div>
                <h1 class="text-2xl font-bold text-white tracking-wider">NEW CODE</h1>
                <p class="text-nc-accent text-sm mt-1">Portal do Professor</p>
            </div>

            <div id="form-login" class="p-8">
                <div class="mb-5">
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">E-mail Corporativo</label>
                    <input type="email" id="login-email" class="w-full bg-nc-panel border border-gray-600 text-white rounded px-4 py-3 focus:outline-none focus:border-nc-accent transition-colors">
                </div>
                <div class="mb-6">
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">Senha</label>
                    <input type="password" id="login-senha" class="w-full bg-nc-panel border border-gray-600 text-white rounded px-4 py-3 focus:outline-none focus:border-nc-accent transition-colors">
                </div>
                <button id="btn-login" class="w-full bg-nc-accent hover:bg-opacity-90 text-nc-dark font-bold py-3 px-4 rounded transition-colors mb-4 flex justify-center items-center h-12">
                    Acessar Sistema
                </button>
                <div class="text-center">
                    <button onclick="alternarTelaAuth('cadastro')" class="text-sm text-gray-400 hover:text-nc-accent transition-colors">Não tem acesso? Criar conta</button>
                </div>
            </div>

            <div id="form-cadastro" class="p-8 hidden">
                <div class="mb-4">
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">Nome Completo</label>
                    <input type="text" id="cadastro-nome" class="w-full bg-nc-panel border border-gray-600 text-white rounded px-4 py-2 focus:outline-none focus:border-nc-accent transition-colors">
                </div>
                <div class="mb-4">
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">E-mail</label>
                    <input type="email" id="cadastro-email" class="w-full bg-nc-panel border border-gray-600 text-white rounded px-4 py-2 focus:outline-none focus:border-nc-accent transition-colors">
                </div>
                <div class="mb-6">
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">Crie uma Senha (mínimo 6 chars)</label>
                    <input type="password" id="cadastro-senha" class="w-full bg-nc-panel border border-gray-600 text-white rounded px-4 py-2 focus:outline-none focus:border-nc-accent transition-colors">
                </div>
                <button id="btn-cadastro" class="w-full bg-nc-accent hover:bg-opacity-90 text-nc-dark font-bold py-3 px-4 rounded transition-colors mb-4 flex justify-center items-center h-12">
                    Registrar Conta
                </button>
                <div class="text-center">
                    <button onclick="alternarTelaAuth('login')" class="text-sm text-gray-400 hover:text-nc-accent transition-colors">Já possui conta? Fazer login</button>
                </div>
            </div>
        </div>
    </div>

    <!-- TELA PRINCIPAL DO APP -->
    <div id="tela-app" class="hidden">
        <div class="bg-nc-header border-b border-gray-700 sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="bg-nc-accent p-1.5 rounded">
                        <svg class="w-5 h-5 text-nc-dark" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
                    </div>
                    <span class="text-white font-bold text-lg tracking-wide hidden sm:block">NEW CODE</span>
                </div>
                
                <div class="text-gray-300 text-sm md:text-base font-medium flex items-center gap-2">
                    Lista de Presença Escolar <span id="sync-status" class="w-2 h-2 rounded-full bg-green-500 hidden" title="Sincronizado"></span>
                </div>

                <div class="flex items-center gap-4">
                    <div class="text-sm text-gray-300 hidden sm:block">
                        Prof: <span id="nome-professor-header" class="text-white font-semibold">...</span>
                    </div>
                    <button id="btn-logout" class="text-sm bg-gray-700 hover:bg-gray-600 text-white px-3 py-1.5 rounded transition-colors">
                        Sair
                    </button>
                </div>
            </div>
            <div class="h-1 bg-nc-accent w-full"></div>
        </div>

        <nav class="bg-nc-panel border-b border-gray-700 shadow-sm mb-6">
            <div class="max-w-7xl mx-auto px-4">
                <div class="flex space-x-6 h-12" id="nav-tabs">
                    <button onclick="changeTab('diario')" class="tab-active px-1 py-2 text-sm focus:outline-none transition-colors" id="tab-diario">Diário de Classe</button>
                    <button onclick="changeTab('cadastros')" class="tab-inactive px-1 py-2 text-sm focus:outline-none transition-colors" id="tab-cadastros">Cadastros Básicos</button>
                </div>
            </div>
        </nav>

        <div class="max-w-7xl mx-auto px-4 pb-10">
            <!-- Seção de Diário -->
            <div id="section-diario">
                <div class="bg-nc-panel p-5 rounded-lg shadow-md border border-gray-700 mb-6 flex flex-col md:flex-row gap-4 items-end">
                    <div class="flex-1 w-full">
                        <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">Turma</label>
                        <select id="select-turma-diario" class="w-full bg-nc-dark border border-gray-600 text-white p-2.5 rounded focus:border-nc-accent focus:outline-none" onchange="renderPlanilha()"></select>
                    </div>
                    <div class="flex-1 w-full">
                        <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">Mês/Ano</label>
                        <input type="month" id="input-mes-diario" class="w-full bg-nc-dark border border-gray-600 text-white p-2.5 rounded focus:border-nc-accent focus:outline-none" onchange="renderPlanilha()">
                    </div>
                    <div class="w-full md:w-auto">
                        <button onclick="adicionarAula()" class="w-full md:w-auto bg-nc-accent hover:bg-opacity-90 text-nc-dark font-bold px-5 py-2.5 rounded transition-colors">
                            + Nova Aula
                        </button>
                    </div>
                </div>

                <div class="overflow-x-auto shadow-lg rounded-lg border border-gray-700 bg-nc-panel">
                    <table class="w-full border-collapse min-w-max text-sm" id="tabela-diario"></table>
                </div>
            </div>

            <!-- Seção de Cadastros -->
            <div id="section-cadastros" class="hidden">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="bg-nc-panel p-6 rounded-lg shadow-md border border-gray-700 relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-1 h-full bg-nc-accent"></div>
                        <h3 class="font-bold text-lg mb-4 text-white">Escolas</h3>
                        <div class="flex gap-2 mb-4">
                            <input type="text" id="nome-escola" placeholder="Nome da Escola" class="bg-nc-dark border border-gray-600 text-white p-2.5 flex-1 rounded focus:border-nc-accent focus:outline-none">
                            <button onclick="adicionar('escolas', 'nome-escola')" class="bg-gray-700 hover:bg-gray-600 text-white font-medium px-4 py-2.5 rounded transition-colors">Salvar</button>
                        </div>
                        <ul id="lista-escolas" class="divide-y divide-gray-700 text-sm text-gray-300"></ul>
                    </div>

                    <div class="bg-nc-panel p-6 rounded-lg shadow-md border border-gray-700 relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-1 h-full bg-nc-accent"></div>
                        <h3 class="font-bold text-lg mb-4 text-white">Matérias / Cursos</h3>
                        <div class="flex gap-2 mb-4">
                            <input type="text" id="nome-materia" placeholder="Ex: Games, Maker" class="bg-nc-dark border border-gray-600 text-white p-2.5 flex-1 rounded focus:border-nc-accent focus:outline-none">
                            <button onclick="adicionar('materias', 'nome-materia')" class="bg-gray-700 hover:bg-gray-600 text-white font-medium px-4 py-2.5 rounded transition-colors">Salvar</button>
                        </div>
                        <ul id="lista-materias" class="divide-y divide-gray-700 text-sm text-gray-300"></ul>
                    </div>

                    <div class="bg-nc-panel p-6 rounded-lg shadow-md border border-gray-700 relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-1 h-full bg-nc-accent"></div>
                        <h3 class="font-bold text-lg mb-4 text-white">Turmas</h3>
                        <div class="flex flex-col gap-3 mb-4">
                            <select id="escola-turma" class="bg-nc-dark border border-gray-600 text-white p-2.5 rounded focus:border-nc-accent focus:outline-none"></select>
                            <div class="flex gap-2">
                                <input type="text" id="nome-turma" placeholder="Ex: Quarta 15:40" class="bg-nc-dark border border-gray-600 text-white p-2.5 flex-1 rounded focus:border-nc-accent focus:outline-none">
                                <button onclick="adicionarTurma()" class="bg-gray-700 hover:bg-gray-600 text-white font-medium px-4 py-2.5 rounded transition-colors">Salvar</button>
                            </div>
                        </div>
                        <ul id="lista-turmas" class="divide-y divide-gray-700 text-sm text-gray-300"></ul>
                    </div>

                    <div class="bg-nc-panel p-6 rounded-lg shadow-md border border-gray-700 relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-1 h-full bg-nc-accent"></div>
                        <h3 class="font-bold text-lg mb-4 text-white">Alunos</h3>
                        <div class="flex flex-col gap-3 mb-4">
                            <select id="turma-aluno" class="bg-nc-dark border border-gray-600 text-white p-2.5 rounded focus:border-nc-accent focus:outline-none"></select>
                            <div class="flex gap-2">
                                <input type="text" id="nome-aluno" placeholder="Nome Completo do Aluno" class="bg-nc-dark border border-gray-600 text-white p-2.5 flex-1 rounded focus:border-nc-accent focus:outline-none">
                                <button onclick="adicionarAluno()" class="bg-gray-700 hover:bg-gray-600 text-white font-medium px-4 py-2.5 rounded transition-colors">Salvar</button>
                            </div>
                        </div>
                        <ul id="lista-alunos" class="divide-y divide-gray-700 text-sm text-gray-300"></ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Conteúdo da Aula -->
    <div id="modal-aula" class="hidden fixed inset-0 bg-nc-dark bg-opacity-80 flex items-center justify-center z-50 p-4">
        <div class="bg-nc-panel border border-gray-700 p-6 rounded-lg shadow-2xl w-full max-w-md">
            <h3 class="font-bold text-xl mb-5 text-white border-b border-gray-700 pb-3">Registro de Aula</h3>
            <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">Data da Aula</label>
            <input type="date" id="modal-data" class="w-full bg-nc-dark border border-gray-600 text-white p-2.5 mb-4 rounded focus:border-nc-accent focus:outline-none">
            <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">Conteúdo Ministrado</label>
            <textarea id="modal-conteudo" rows="3" class="w-full bg-nc-dark border border-gray-600 text-white p-2.5 mb-6 rounded focus:border-nc-accent focus:outline-none resize-none"></textarea>
            <div class="flex justify-end gap-3">
                <button onclick="fecharModal()" class="px-4 py-2.5 text-gray-300 font-medium hover:bg-gray-700 rounded transition-colors">Cancelar</button>
                <button onclick="salvarAula()" class="px-5 py-2.5 bg-nc-accent hover:bg-opacity-90 text-nc-dark font-bold rounded transition-colors">Salvar Registro</button>
            </div>
        </div>
    </div>

    <!-- IMPORTAÇÃO OFICIAL DO FIREBASE (MODULAR) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // =========================================================================
        // ATENÇÃO: COLE SUAS CREDENCIAIS DO FIREBASE AQUI DENTRO
        // =========================================================================
        const firebaseConfig = {
          apiKey: "AIzaSyDUYpc-GItAeunBFFvaz6ByaFnJ7yxYji0",
          authDomain: "diario-newcode.firebaseapp.com",
          projectId: "diario-newcode",
          storageBucket: "diario-newcode.firebasestorage.app",
          messagingSenderId: "440225334729",
          appId: "1:440225334729:web:6e2fc05a88502c3ff69418",
          measurementId: "G-1TQE6YPV6N"
        };
        // =========================================================================

        let app, auth, dbFirestore;
        
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            dbFirestore = getFirestore(app);
        } catch(e) {
            console.error("Erro ao iniciar Firebase. Verifique suas credenciais.", e);
        }

        // Variável global para armazenar os dados em tempo de execução
        window.dbLocal = { escolas: [], materias: [], turmas: [], alunos: [], aulas: [], presencas: {} };
        let currentUser = null;

        // Funções UI
        window.mostrarToast = function(mensagem, tipo = 'sucesso') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${tipo}`;
            toast.innerText = mensagem;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'fadeOut 0.3s forwards';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        window.alternarTelaAuth = function(tela) {
            if (tela === 'cadastro') {
                document.getElementById('form-login').classList.add('hidden');
                document.getElementById('form-cadastro').classList.remove('hidden');
            } else {
                document.getElementById('form-cadastro').classList.add('hidden');
                document.getElementById('form-login').classList.remove('hidden');
            }
        };

        // Escutando mudanças de estado do usuário logado
        onAuthStateChanged(auth, (user) => {
            document.getElementById('tela-loading').classList.add('hidden');
            if (user) {
                currentUser = user;
                document.getElementById('tela-auth').classList.add('hidden');
                document.getElementById('tela-app').classList.remove('hidden');
                document.getElementById('nome-professor-header').innerText = user.displayName || 'Professor';
                
                const dataAtual = new Date();
                const mesFormatado = `${dataAtual.getFullYear()}-${String(dataAtual.getMonth() + 1).padStart(2, '0')}`;
                document.getElementById('input-mes-diario').value = mesFormatado;

                carregarDadosNuvem(user.uid);
            } else {
                currentUser = null;
                document.getElementById('tela-app').classList.add('hidden');
                document.getElementById('tela-auth').classList.remove('hidden');
            }
        });

        // Eventos dos botões de Autenticação
        document.getElementById('btn-login').addEventListener('click', async () => {
            const email = document.getElementById('login-email').value.trim();
            const senha = document.getElementById('login-senha').value;
            const btn = document.getElementById('btn-login');

            if (!email || !senha) return window.mostrarToast("Preencha email e senha.", "erro");
            
            btn.innerHTML = '<div class="loader"></div>';
            try {
                await signInWithEmailAndPassword(auth, email, senha);
                document.getElementById('login-senha').value = '';
            } catch (error) {
                window.mostrarToast("Credenciais incorretas ou conta não existe.", "erro");
            }
            btn.innerHTML = 'Acessar Sistema';
        });

        document.getElementById('btn-cadastro').addEventListener('click', async () => {
            const nome = document.getElementById('cadastro-nome').value.trim();
            const email = document.getElementById('cadastro-email').value.trim();
            const senha = document.getElementById('cadastro-senha').value;
            const btn = document.getElementById('btn-cadastro');

            if (!nome || !email || !senha) return window.mostrarToast("Preencha todos os campos.", "erro");
            if (senha.length < 6) return window.mostrarToast("A senha deve ter no mínimo 6 caracteres.", "erro");

            btn.innerHTML = '<div class="loader"></div>';
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, senha);
                await updateProfile(userCredential.user, { displayName: nome });
                
                // Cria documento zerado para o usuário no banco
                await setDoc(doc(dbFirestore, "diarios", userCredential.user.uid), window.dbLocal);
                window.mostrarToast("Conta criada com sucesso!", "sucesso");
            } catch (error) {
                if(error.code === 'auth/email-already-in-use') window.mostrarToast("E-mail já está em uso.", "erro");
                else window.mostrarToast("Erro ao criar conta.", "erro");
                console.error(error);
            }
            btn.innerHTML = 'Registrar Conta';
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            signOut(auth);
        });

        // Sincronização com o Firestore
        function carregarDadosNuvem(uid) {
            const docRef = doc(dbFirestore, "diarios", uid);
            
            // onSnapshot escuta em tempo real. Qualquer mudança no banco reflete na tela.
            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    window.dbLocal = docSnap.data();
                } else {
                    window.dbLocal = { escolas: [], materias: [], turmas: [], alunos: [], aulas: [], presencas: {} };
                    setDoc(docRef, window.dbLocal);
                }
                
                document.getElementById('sync-status').classList.remove('hidden');
                
                window.atualizarSelects();
                window.renderCadastros();
                window.renderPlanilha();
            });
        }

        window.salvarDados = async function() {
            if(!currentUser) return;
            document.getElementById('sync-status').classList.add('hidden'); // Apaga bolinha verde
            try {
                const docRef = doc(dbFirestore, "diarios", currentUser.uid);
                await setDoc(docRef, window.dbLocal);
                // A bolinha volta a acender via onSnapshot
            } catch(e) {
                window.mostrarToast("Erro ao salvar na nuvem.", "erro");
                console.error(e);
            }
        }

        // ==========================================
        // LÓGICA DO DIÁRIO (IGUAL A ANTERIOR)
        // ==========================================
        window.changeTab = function(tab) {
            document.getElementById('section-diario').classList.add('hidden');
            document.getElementById('section-cadastros').classList.add('hidden');
            document.getElementById('tab-diario').className = 'tab-inactive px-1 py-2 text-sm focus:outline-none transition-colors';
            document.getElementById('tab-cadastros').className = 'tab-inactive px-1 py-2 text-sm focus:outline-none transition-colors';
            document.getElementById('section-' + tab).classList.remove('hidden');
            document.getElementById('tab-' + tab).className = 'tab-active px-1 py-2 text-sm focus:outline-none transition-colors';
            if(tab === 'cadastros') window.renderCadastros();
            if(tab === 'diario') window.renderPlanilha();
        }

        window.gerarId = function() { return Date.now(); }

        window.adicionar = function(tabela, inputId) {
            const input = document.getElementById(inputId);
            if (!input.value.trim()) return window.mostrarToast("O campo não pode estar vazio.", "erro");
            window.dbLocal[tabela].push({ id: window.gerarId(), nome: input.value.trim() });
            input.value = '';
            window.salvarDados();
            window.mostrarToast("Registro salvo com sucesso.");
        }

        window.adicionarTurma = function() {
            const nome = document.getElementById('nome-turma').value;
            const escolaId = document.getElementById('escola-turma').value;
            if (!nome.trim() || !escolaId) return window.mostrarToast("Preencha o nome e selecione a escola.", "erro");
            window.dbLocal.turmas.push({ id: window.gerarId(), nome: nome.trim(), escolaId: parseInt(escolaId) });
            document.getElementById('nome-turma').value = '';
            window.salvarDados();
            window.mostrarToast("Turma salva com sucesso.");
        }

        window.adicionarAluno = function() {
            const nome = document.getElementById('nome-aluno').value;
            const turmaId = document.getElementById('turma-aluno').value;
            if (!nome.trim() || !turmaId) return window.mostrarToast("Preencha o nome e selecione a turma.", "erro");
            window.dbLocal.alunos.push({ id: window.gerarId(), nome: nome.trim(), turmaId: parseInt(turmaId) });
            document.getElementById('nome-aluno').value = '';
            window.salvarDados();
            window.mostrarToast("Aluno adicionado à turma.");
        }

        window.remover = function(tabela, id) {
            window.dbLocal[tabela] = window.dbLocal[tabela].filter(item => item.id !== id);
            window.salvarDados();
            window.mostrarToast("Registro removido.");
        }

        window.renderCadastros = function() {
            const renderLista = (tabela, elementoId, infoExtra = null) => {
                const ul = document.getElementById(elementoId);
                ul.innerHTML = '';
                if(window.dbLocal[tabela].length === 0) {
                    ul.innerHTML = '<li class="py-3 text-gray-500 italic text-center">Nenhum registro encontrado.</li>';
                    return;
                }
                window.dbLocal[tabela].forEach(item => {
                    let extra = '';
                    if (infoExtra === 'turma') {
                        const escola = window.dbLocal.escolas.find(e => e.id === item.escolaId);
                        extra = `<span class="text-xs text-gray-500 block">${escola ? escola.nome : 'Sem escola'}</span>`;
                    } else if (infoExtra === 'aluno') {
                        const turma = window.dbLocal.turmas.find(t => t.id === item.turmaId);
                        extra = `<span class="text-xs text-gray-500 block">${turma ? turma.nome : 'Sem turma'}</span>`;
                    }
                    ul.innerHTML += `
                        <li class="py-3 flex justify-between items-center group">
                            <div><span class="text-gray-200 font-medium">${item.nome}</span>${extra}</div>
                            <button onclick="remover('${tabela}', ${item.id})" class="text-gray-500 hover:text-red-400 transition-colors px-2">X</button>
                        </li>`;
                });
            };
            renderLista('escolas', 'lista-escolas');
            renderLista('materias', 'lista-materias');
            renderLista('turmas', 'lista-turmas', 'turma');
            renderLista('alunos', 'lista-alunos', 'aluno');
        }

        window.atualizarSelects = function() {
            const preencher = (selectId, dados, placeholder) => {
                const select = document.getElementById(selectId);
                const valorAtual = select.value;
                select.innerHTML = `<option value="">${placeholder}</option>`;
                dados.forEach(item => {
                    let extra = '';
                    if(selectId === 'select-turma-diario' || selectId === 'turma-aluno') {
                        const escola = window.dbLocal.escolas.find(e => e.id === item.escolaId);
                        extra = escola ? ` - ${escola.nome}` : '';
                    }
                    select.innerHTML += `<option value="${item.id}">${item.nome}${extra}</option>`;
                });
                if (dados.find(d => d.id == valorAtual)) select.value = valorAtual;
                else if (dados.length > 0 && selectId === 'select-turma-diario') select.value = dados[0].id;
            };
            preencher('escola-turma', window.dbLocal.escolas, 'Selecione a Escola');
            preencher('turma-aluno', window.dbLocal.turmas, 'Selecione a Turma');
            preencher('select-turma-diario', window.dbLocal.turmas, 'Selecione a Turma...');
        }

        let turmaAtualId = null;

        window.formatarData = function(dataString) {
            const [ano, mes, dia] = dataString.split('-');
            const dataObj = new Date(ano, mes - 1, dia);
            const diasSemana = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
            return `<div class="font-bold">${dia}/${mes}</div><div class="text-[10px] font-normal text-gray-400 uppercase tracking-wider mt-0.5">${diasSemana[dataObj.getDay()]}</div>`;
        }

        window.renderPlanilha = function() {
            const turmaSelect = document.getElementById('select-turma-diario').value;
            const mesSelect = document.getElementById('input-mes-diario').value; 
            
            if (!turmaSelect) {
                document.getElementById('tabela-diario').innerHTML = '<tr><td class="p-8 text-center text-gray-400">Selecione uma turma.</td></tr>';
                return;
            }

            turmaAtualId = parseInt(turmaSelect);
            const turma = window.dbLocal.turmas.find(t => t.id === turmaAtualId);
            const escola = window.dbLocal.escolas.find(e => e.id === turma.escolaId);
            const alunosTurma = window.dbLocal.alunos.filter(a => a.turmaId === turmaAtualId);
            const aulas = window.dbLocal.aulas.filter(a => {
                if (a.turmaId !== turmaAtualId) return false;
                if (mesSelect) return a.data.startsWith(mesSelect);
                return true;
            }).sort((a, b) => a.data.localeCompare(b.data));

            const mesAnoFormatado = mesSelect ? 
                new Date(mesSelect + '-01T00:00:00').toLocaleDateString('pt-BR', {month: 'long', year: 'numeric'}).replace(' de ', ' ') : 'Todas as datas';

            let html = `
                <thead>
                    <tr><th colspan="${aulas.length + 3}" class="bg-nc-header text-white p-3 text-center text-lg font-medium border-b-4 border-nc-accent"><span class="capitalize">${mesAnoFormatado}</span></th></tr>
                    <tr><th colspan="${aulas.length + 3}" class="bg-nc-header text-gray-300 p-2 text-center text-xs font-normal tracking-wide uppercase border-b border-gray-600">${escola ? escola.nome : 'Sem escola'} &nbsp;&middot;&nbsp; ${turma.nome}</th></tr>
                    <tr><th class="bg-nc-header text-white border-r border-gray-600 p-3 text-left w-64 uppercase tracking-wider text-xs font-semibold">ALUNO</th>
            `;

            aulas.forEach(aula => {
                html += `<th class="bg-nc-header text-white border-r border-gray-600 p-2 w-16 text-center cursor-pointer hover:bg-gray-700 transition-colors" title="${aula.conteudo || 'Sem conteúdo'}" onclick="editarAula(${aula.id})">${window.formatarData(aula.data)}</th>`;
            });
            if(aulas.length === 0) html += `<th class="bg-nc-header text-gray-500 font-normal text-xs p-2 text-center">Nenhuma aula</th>`;

            html += `
                        <th class="bg-nc-green-header text-white border-l border-gray-600 p-3 w-16 text-center text-xs uppercase tracking-wide">Total P</th>
                        <th class="bg-nc-red-header text-white p-3 w-16 text-center text-xs uppercase tracking-wide">Total F</th>
                    </tr>
                </thead><tbody>
            `;

            if(alunosTurma.length === 0) html += `<tr><td colspan="${aulas.length + 3}" class="p-8 text-center text-gray-500">Nenhum aluno cadastrado.</td></tr>`;

            alunosTurma.forEach((aluno, index) => {
                const bgClass = index % 2 === 0 ? 'bg-nc-dark' : 'bg-nc-row-alt-dark';
                let totalP = 0, totalF = 0;
                html += `<tr class="${bgClass} hover:bg-gray-800 transition-colors"><td class="border-r border-gray-700 border-b p-3 text-gray-200 font-medium whitespace-nowrap">${aluno.nome}</td>`;
                if(aulas.length === 0) html += `<td class="border-b border-gray-700"></td>`;

                aulas.forEach(aula => {
                    const chave = `${aula.id}_${aluno.id}`;
                    const status = window.dbLocal.presencas[chave] || '';
                    if (status === 'P') totalP++;
                    if (status === 'F') totalF++;
                    let textClass = status === 'P' ? 'status-p' : (status === 'F' ? 'status-f' : '');

                    html += `<td class="border-r border-b border-gray-700 p-0">
                                <select class="select-status ${textClass}" onchange="registrarPresenca(${aula.id}, ${aluno.id}, this.value)">
                                    <option value="" ${status === '' ? 'selected' : ''}></option>
                                    <option value="P" ${status === 'P' ? 'selected' : ''}>P</option>
                                    <option value="F" ${status === 'F' ? 'selected' : ''}>F</option>
                                </select>
                             </td>`;
                });
                html += `<td class="border-l border-b border-gray-700 bg-nc-green-cell-dark text-center font-bold text-white">${totalP}</td><td class="border-b border-gray-700 bg-nc-red-cell-dark text-center font-bold text-white">${totalF}</td></tr>`;
            });

            html += `</tbody>`;
            document.getElementById('tabela-diario').innerHTML = html;
        }

        window.registrarPresenca = function(aulaId, alunoId, status) {
            const chave = `${aulaId}_${alunoId}`;
            window.dbLocal.presencas[chave] = status;
            window.salvarDados(); 
            // Não renderizamos manualmente aqui, o Firebase onSnapshot cuida disso!
        }

        window.adicionarAula = function() {
            if (!turmaAtualId) return window.mostrarToast("Selecione uma turma.", "erro");
            document.getElementById('modal-data').value = '';
            document.getElementById('modal-conteudo').value = '';
            document.getElementById('modal-aula').dataset.aulaId = '';
            document.getElementById('modal-aula').classList.remove('hidden');
        }

        window.editarAula = function(id) {
            const aula = window.dbLocal.aulas.find(a => a.id === id);
            if(!aula) return;
            document.getElementById('modal-data').value = aula.data;
            document.getElementById('modal-conteudo').value = aula.conteudo;
            document.getElementById('modal-aula').dataset.aulaId = aula.id;
            document.getElementById('modal-aula').classList.remove('hidden');
        }

        window.fecharModal = function() { document.getElementById('modal-aula').classList.add('hidden'); }

        window.salvarAula = function() {
            const data = document.getElementById('modal-data').value;
            const conteudo = document.getElementById('modal-conteudo').value;
            const aulaId = document.getElementById('modal-aula').dataset.aulaId;

            if(!data) return window.mostrarToast("A data é obrigatória.", "erro");

            if(aulaId) {
                const aula = window.dbLocal.aulas.find(a => a.id === parseInt(aulaId));
                aula.data = data;
                aula.conteudo = conteudo;
                window.mostrarToast("Aula atualizada com sucesso.");
            } else {
                window.dbLocal.aulas.push({ id: window.gerarId(), turmaId: turmaAtualId, data: data, conteudo: conteudo });
                window.mostrarToast("Nova aula registrada.");
            }
            window.salvarDados();
            window.fecharModal();
        }
    </script>
</body>
</html>
