<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEW CODE - Diário Escolar</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'nc-dark': '#0B1320', 
                        'nc-primary': '#1A2E4C',
                        'nc-primary-hover': '#254069',
                        'nc-accent': '#5CB4CD',
                        'nc-bg': '#F1F5F9',
                        'nc-surface': '#FFFFFF',
                        'nc-text': '#334155',
                        'nc-border': '#E2E8F0',
                        'nc-row-alt': '#F0F4F8',
                        'nc-p-header': '#528251',
                        'nc-p-cell': '#D9EAD8',
                        'nc-p-text': '#166534',
                        'nc-f-header': '#B9634C',
                        'nc-f-cell': '#F7D7D7',
                        'nc-f-text': '#991B1B',
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            @apply bg-nc-bg text-nc-text dark:bg-slate-900 dark:text-slate-200;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { @apply bg-slate-300 dark:bg-slate-600 rounded; }
        ::-webkit-scrollbar-thumb:hover { @apply bg-slate-400 dark:bg-slate-500; }

        .modern-input {
            width: 100%;
            padding: 0.625rem 0.875rem;
            @apply bg-slate-50 border-slate-200 text-slate-700 dark:bg-slate-900 dark:border-slate-700 dark:text-slate-200;
            border-width: 1px;
            border-style: solid;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            transition: all 0.2s ease;
        }
        .modern-input:focus {
            outline: none;
            @apply border-nc-accent dark:border-nc-accent ring-2 ring-nc-accent/20 dark:ring-nc-accent/20;
            @apply bg-white dark:bg-slate-800;
        }

        .modern-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.625rem 1.25rem;
            font-size: 0.875rem;
            font-weight: 600;
            border-radius: 0.5rem;
            transition: all 0.2s;
            cursor: pointer;
        }
        .btn-primary { background-color: #1A2E4C; color: white; }
        .btn-primary:hover { background-color: #254069; transform: translateY(-1px); }
        .btn-accent { background-color: #5CB4CD; color: #0B1320; }
        .btn-accent:hover { background-color: #4AA0B9; transform: translateY(-1px); }

        .select-status {
            appearance: none;
            background-color: transparent;
            border: none;
            width: 100%;
            height: 100%;
            text-align: center;
            font-weight: 700;
            cursor: pointer;
            outline: none;
            font-size: 0.875rem;
            padding: 0.5rem;
        }
        .status-p { @apply text-green-700 dark:text-green-400; }
        .status-f { @apply text-red-700 dark:text-red-400; }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .toast-enter { animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }

        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-left-color: #5CB4CD;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Notificações Profissionais -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 w-80"></div>

    <!-- TELA DE LOADING INICIAL -->
    <div id="tela-loading" class="flex-1 flex items-center justify-center p-4 w-full z-50 bg-nc-bg dark:bg-slate-900 transition-colors">
        <div class="loader w-12 h-12"></div>
    </div>

    <!-- ================= TELA DE AUTENTICAÇÃO ================= -->
    <div id="auth-container" class="flex-1 hidden flex-col justify-center items-center p-6 w-full z-50 bg-nc-bg dark:bg-slate-900 transition-colors">
        <div class="bg-white dark:bg-slate-800 w-full max-w-md rounded-2xl shadow-xl overflow-hidden border border-nc-border dark:border-slate-700 transition-colors">
            <div class="bg-nc-primary p-6 text-center border-b-[6px] border-nc-accent">
                <div class="w-12 h-12 bg-nc-accent rounded flex items-center justify-center text-nc-primary font-bold text-2xl mx-auto mb-3 shadow-sm">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
                </div>
                <h2 class="text-2xl font-bold text-white tracking-wider">NEW CODE</h2>
                <p class="text-nc-accent text-sm font-medium mt-1">Portal do Professor</p>
            </div>
            
            <div class="p-8">
                <!-- Form Login -->
                <div id="form-login" class="space-y-5">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-1.5">E-mail Corporativo</label>
                        <input type="email" id="login-email" class="modern-input" placeholder="professor@newcode.com">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-1.5">Senha</label>
                        <input type="password" id="login-senha" class="modern-input" placeholder="••••••••">
                    </div>
                    <button id="btn-login" class="modern-btn btn-primary w-full py-3 mt-2 text-base shadow-lg">Acessar Sistema</button>
                    <div class="text-center mt-4">
                        <button type="button" onclick="toggleAuthMode()" class="text-sm text-nc-primary dark:text-nc-accent hover:opacity-80 transition-opacity font-medium">Não tem acesso? Criar conta</button>
                    </div>
                </div>

                <!-- Form Cadastro -->
                <div id="form-cadastro" class="space-y-5 hidden">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-1.5">Nome Completo</label>
                        <input type="text" id="cad-nome" class="modern-input" placeholder="Ex: Prof. Silva">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-1.5">E-mail Corporativo</label>
                        <input type="email" id="cad-email" class="modern-input" placeholder="professor@newcode.com">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-1.5">Definir Senha</label>
                        <input type="password" id="cad-senha" class="modern-input" placeholder="Mín. 6 caracteres">
                    </div>
                    <button id="btn-cadastro" class="modern-btn btn-primary w-full py-3 mt-2 text-base shadow-lg">Registrar e Acessar</button>
                    <div class="text-center mt-4">
                        <button type="button" onclick="toggleAuthMode()" class="text-sm text-gray-500 dark:text-gray-400 hover:text-nc-primary dark:hover:text-nc-accent transition-colors font-medium">Já possui conta? Fazer login</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Header Corporativo Elegante -->
    <header id="app-header" class="hidden bg-nc-primary w-full shadow-md z-10 transition-colors">
        <div class="h-1 bg-nc-accent w-full"></div>
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-nc-accent rounded flex items-center justify-center text-nc-primary font-bold text-xl">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
                </div>
                <h1 class="text-xl font-bold text-white tracking-wider">NEW CODE <span class="font-light opacity-75 text-sm ml-2 hidden sm:inline">| Gestão Escolar</span></h1>
            </div>
            
            <nav class="hidden md:flex space-x-2 bg-nc-primary-hover p-1 rounded-lg">
                <button onclick="changeTab('diario')" id="tab-diario" class="px-4 py-1.5 text-sm font-medium rounded-md bg-white text-nc-primary shadow-sm transition-all">Diário de Presença</button>
                <button onclick="changeTab('cadastros')" id="tab-cadastros" class="px-4 py-1.5 text-sm font-medium rounded-md text-gray-300 hover:text-white hover:bg-white/10 transition-all">Cadastros</button>
            </nav>
            
            <div class="flex items-center gap-4">
                <button onclick="toggleTheme()" id="theme-toggle-btn" class="w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center transition-all" title="Alternar Tema">
                    <svg id="icon-sun" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <svg id="icon-moon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                </button>
                <div class="hidden sm:block text-right">
                    <p class="text-xs text-nc-accent font-medium uppercase tracking-wider flex items-center gap-1 justify-end">Professor <span id="sync-status" class="w-2 h-2 rounded-full bg-green-500 hidden" title="Nuvem Sincronizada"></span></p>
                    <p id="user-display-name" class="text-sm text-white font-bold truncate max-w-[120px]"></p>
                </div>
                <button id="btn-logout" class="w-9 h-9 rounded-full bg-white/10 hover:bg-red-500/80 text-white flex items-center justify-center transition-all" title="Sair do Sistema">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                </button>
            </div>
        </div>
        <!-- Mobile Nav -->
        <nav class="md:hidden flex space-x-2 p-4 bg-nc-primary">
            <button onclick="changeTab('diario')" id="tab-diario-mobile" class="flex-1 px-4 py-1.5 text-sm font-medium rounded-md bg-white text-nc-primary shadow-sm transition-all">Diário</button>
            <button onclick="changeTab('cadastros')" id="tab-cadastros-mobile" class="flex-1 px-4 py-1.5 text-sm font-medium rounded-md text-gray-300 hover:text-white hover:bg-white/10 transition-all">Cadastros</button>
        </nav>
    </header>

    <main id="app-main" class="hidden max-w-7xl mx-auto px-4 md:px-6 py-8 w-full flex-1 transition-colors">

        <!-- ================= SEÇÃO DIÁRIO ================= -->
        <div id="section-diario" class="space-y-6">
            <div class="bg-white dark:bg-slate-800 p-5 rounded-xl shadow-sm border border-nc-border dark:border-slate-700 flex flex-wrap gap-4 items-end justify-between transition-colors">
                <div class="flex flex-wrap gap-4 flex-1">
                    <div class="flex-1 min-w-[200px]">
                        <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-1.5">Turma</label>
                        <select id="select-turma-diario" class="modern-input" onchange="renderPlanilha()"></select>
                    </div>
                    <div class="flex-1 min-w-[150px]">
                        <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-1.5">Mês de Referência</label>
                        <input type="month" id="input-mes-diario" class="modern-input" onchange="renderPlanilha()">
                    </div>
                </div>
                <div class="w-full md:w-auto mt-2 md:mt-0">
                    <button onclick="adicionarAula()" class="w-full modern-btn btn-primary flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        Lançar Aula
                    </button>
                </div>
            </div>

            <div class="bg-white dark:bg-slate-800 rounded-xl shadow-md border border-nc-border dark:border-slate-700 overflow-hidden transition-colors">
                <div class="overflow-x-auto">
                    <table class="w-full border-collapse text-sm" id="tabela-diario"></table>
                </div>
            </div>
        </div>

        <!-- ================= SEÇÃO CADASTROS ================= -->
        <div id="section-cadastros" class="hidden">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Escolas -->
                <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-nc-border dark:border-slate-700 transition-colors">
                    <div class="flex items-center gap-2 mb-4 pb-2 border-b border-gray-100 dark:border-slate-700">
                        <svg class="w-5 h-5 text-nc-primary dark:text-nc-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                        <h3 class="font-bold text-lg text-nc-dark dark:text-white">Unidades / Escolas</h3>
                    </div>
                    <div class="flex gap-2 mb-4">
                        <input type="text" id="nome-escola" placeholder="Nome da instituição" class="modern-input">
                        <button onclick="adicionar('escolas', 'nome-escola')" class="modern-btn btn-primary px-4">+</button>
                    </div>
                    <ul id="lista-escolas" class="space-y-2 max-h-60 overflow-y-auto pr-2"></ul>
                </div>

                <!-- Matérias -->
                <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-nc-border dark:border-slate-700 transition-colors">
                    <div class="flex items-center gap-2 mb-4 pb-2 border-b border-gray-100 dark:border-slate-700">
                        <svg class="w-5 h-5 text-nc-primary dark:text-nc-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                        <h3 class="font-bold text-lg text-nc-dark dark:text-white">Matérias / Cursos</h3>
                    </div>
                    <div class="flex gap-2 mb-4">
                        <input type="text" id="nome-materia" placeholder="Ex: GAMES, ROBÓTICA..." class="modern-input">
                        <button onclick="adicionar('materias', 'nome-materia')" class="modern-btn btn-primary px-4">+</button>
                    </div>
                    <ul id="lista-materias" class="space-y-2 max-h-60 overflow-y-auto pr-2"></ul>
                </div>

                <!-- Turmas -->
                <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-nc-border dark:border-slate-700 transition-colors">
                    <div class="flex items-center gap-2 mb-4 pb-2 border-b border-gray-100 dark:border-slate-700">
                        <svg class="w-5 h-5 text-nc-primary dark:text-nc-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                        <h3 class="font-bold text-lg text-nc-dark dark:text-white">Gestão de Turmas</h3>
                    </div>
                    <div class="space-y-3 mb-4">
                        <select id="escola-turma" class="modern-input"></select>
                        <div class="flex gap-2">
                            <input type="text" id="nome-turma" placeholder="Dia/Horário (Ex: Qua | 15:40)" class="modern-input">
                            <button onclick="adicionarTurma()" class="modern-btn btn-primary px-4">+</button>
                        </div>
                    </div>
                    <ul id="lista-turmas" class="space-y-2 max-h-60 overflow-y-auto pr-2"></ul>
                </div>

                <!-- Alunos -->
                <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-nc-border dark:border-slate-700 transition-colors">
                    <div class="flex items-center gap-2 mb-4 pb-2 border-b border-gray-100 dark:border-slate-700">
                        <svg class="w-5 h-5 text-nc-primary dark:text-nc-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        <h3 class="font-bold text-lg text-nc-dark dark:text-white">Alunos</h3>
                    </div>
                    <div class="space-y-3 mb-4">
                        <select id="turma-aluno" class="modern-input"></select>
                        <div class="flex gap-2">
                            <input type="text" id="nome-aluno" placeholder="Nome completo do aluno" class="modern-input">
                            <button onclick="adicionarAluno()" class="modern-btn btn-primary px-4">+</button>
                        </div>
                    </div>
                    <ul id="lista-alunos" class="space-y-2 max-h-60 overflow-y-auto pr-2"></ul>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal de Nova Aula -->
    <div id="modal-aula" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 transition-opacity p-4">
        <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-2xl w-full max-w-md border border-nc-border dark:border-slate-700">
            <div class="flex justify-between items-center mb-5 border-b border-gray-100 dark:border-slate-700 pb-3">
                <h3 class="font-bold text-xl text-nc-primary dark:text-white">Registro de Aula</h3>
                <button onclick="fecharModal()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1.5">Data da Aula</label>
                    <input type="date" id="modal-data" class="modern-input">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1.5">Conteúdo / Observações</label>
                    <input type="text" id="modal-conteudo" class="modern-input" placeholder="Ex: Introdução à Lógica">
                </div>
            </div>
            <div class="flex justify-end gap-3 mt-6 pt-4 border-t border-gray-50 dark:border-slate-700">
                <button onclick="fecharModal()" class="modern-btn bg-white dark:bg-slate-700 text-gray-600 dark:text-gray-200 border border-gray-300 dark:border-slate-600 hover:bg-gray-50 dark:hover:bg-slate-600">Cancelar</button>
                <button onclick="salvarAula()" class="modern-btn btn-primary">Salvar Registro</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDUYpc-GItAeunBFFvaz6ByaFnJ7yxYji0",
          authDomain: "diario-newcode.firebaseapp.com",
          projectId: "diario-newcode",
          storageBucket: "diario-newcode.firebasestorage.app",
          messagingSenderId: "440225334729",
          appId: "1:440225334729:web:6e2fc05a88502c3ff69418",
          measurementId: "G-1TQE6YPV6N"
        };

        // 2. Inicializa o serviço do Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const firestoreDb = getFirestore(app);

        // 3. Deixa o banco da nuvem preparado para uso no app
        window.firebaseApp = app;
        window.firebaseAuth = auth;
        window.firebaseDb = firestoreDb;
        console.log("Serviços em Nuvem (Firebase) preparados!");

        let app, auth, dbFirestore;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            dbFirestore = getFirestore(app);
            console.log("Firebase conectado.");
        } catch(e) {
            console.error("Erro ao iniciar Firebase.", e);
        }

        // Variável global de dados da nuvem
        window.dbLocal = { escolas: [], materias: [], turmas: [], alunos: [], aulas: [], presencas: {} };
        let currentUser = null;

        window.mostrarToast = function(mensagem, tipo = 'sucesso') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            let bgClass = 'bg-white dark:bg-slate-800 border-l-4';
            let textClass = 'text-gray-700 dark:text-gray-200';
            let borderClass = tipo === 'erro' ? 'border-red-500' : 'border-green-500';
            let icon = tipo === 'erro' 
                ? `<svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`
                : `<svg class="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;

            toast.className = `toast-enter ${bgClass} ${borderClass} shadow-lg rounded-r-md p-4 flex items-center gap-3 mb-2`;
            toast.innerHTML = `${icon}<span class="text-sm font-medium ${textClass}">${mensagem}</span>`;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        window.toggleAuthMode = function() {
            document.getElementById('form-login').classList.toggle('hidden');
            document.getElementById('form-cadastro').classList.toggle('hidden');
        };

        // Listener de Autenticação (Observador Mágico do Firebase)
        onAuthStateChanged(auth, (user) => {
            document.getElementById('tela-loading').classList.add('hidden');
            if (user) {
                currentUser = user;
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('app-header').classList.remove('hidden');
                document.getElementById('app-main').classList.remove('hidden');
                document.getElementById('user-display-name').innerText = user.displayName || 'Professor';
                
                const dataAtual = new Date();
                const mesFormatado = `${dataAtual.getFullYear()}-${String(dataAtual.getMonth() + 1).padStart(2, '0')}`;
                document.getElementById('input-mes-diario').value = mesFormatado;

                // Baixar dados do banco
                carregarDadosNuvem(user.uid);
            } else {
                currentUser = null;
                document.getElementById('auth-container').classList.remove('hidden');
                document.getElementById('auth-container').classList.add('flex');
                document.getElementById('app-header').classList.add('hidden');
                document.getElementById('app-main').classList.add('hidden');
            }
        });

        // Login
        document.getElementById('btn-login').addEventListener('click', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const senha = document.getElementById('login-senha').value;
            const btn = document.getElementById('btn-login');

            if (!email || !senha) return window.mostrarToast("Preencha email e senha.", "erro");
            
            btn.innerHTML = '<div class="loader"></div>';
            try {
                await signInWithEmailAndPassword(auth, email, senha);
                document.getElementById('login-senha').value = '';
                window.mostrarToast("Login efetuado com sucesso.");
            } catch (error) {
                window.mostrarToast("E-mail ou senha incorretos.", "erro");
                console.error(error);
            }
            btn.innerHTML = 'Acessar Sistema';
        });

        // Cadastro
        document.getElementById('btn-cadastro').addEventListener('click', async (e) => {
            e.preventDefault();
            const nome = document.getElementById('cad-nome').value.trim();
            const email = document.getElementById('cad-email').value.trim();
            const senha = document.getElementById('cad-senha').value;
            const btn = document.getElementById('btn-cadastro');

            if (!nome || !email || !senha) return window.mostrarToast("Preencha todos os campos.", "erro");
            if (senha.length < 6) return window.mostrarToast("A senha deve ter no mínimo 6 caracteres.", "erro");

            btn.innerHTML = '<div class="loader"></div>';
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, senha);
                await updateProfile(userCredential.user, { displayName: nome });
                
                // Cria documento zerado para o usuário no Firestore (Banco)
                await setDoc(doc(dbFirestore, "diarios", userCredential.user.uid), window.dbLocal);
                window.mostrarToast("Conta criada com sucesso!");
                
                document.getElementById('cad-senha').value = '';
            } catch (error) {
                if(error.code === 'auth/email-already-in-use') {
                    window.mostrarToast("Este e-mail já está em uso.", "erro");
                } else {
                    window.mostrarToast("Erro ao criar conta no servidor.", "erro");
                }
                console.error(error);
            }
            btn.innerHTML = 'Registrar e Acessar';
        });

        // Logout
        document.getElementById('btn-logout').addEventListener('click', () => {
            signOut(auth).then(() => {
                window.mostrarToast("Você saiu do sistema.");
            });
        });

        // Sincronização com o Firestore
        function carregarDadosNuvem(uid) {
            const docRef = doc(dbFirestore, "diarios", uid);
            
            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    window.dbLocal = docSnap.data();
                } else {
                    window.dbLocal = { escolas: [], materias: [], turmas: [], alunos: [], aulas: [], presencas: {} };
                    setDoc(docRef, window.dbLocal);
                }
                
                document.getElementById('sync-status').classList.remove('hidden');
                window.atualizarSelects();
                window.renderCadastros();
                window.renderPlanilha();
            }, (error) => {
                console.error("Erro ao escutar mudanças: ", error);
            });
        }

        window.salvarDados = async function() {
            if(!currentUser) return;
            document.getElementById('sync-status').classList.add('hidden'); // Apaga bolinha de sync temporariamente
            try {
                const docRef = doc(dbFirestore, "diarios", currentUser.uid);
                await setDoc(docRef, window.dbLocal);
            } catch(e) {
                window.mostrarToast("Erro ao sincronizar com a nuvem.", "erro");
                console.error(e);
            }
        }

        // ==========================================
        // LÓGICA DO DIÁRIO / CADASTROS
        // ==========================================
        window.changeTab = function(tab) {
            document.getElementById('section-diario').classList.add('hidden');
            document.getElementById('section-cadastros').classList.add('hidden');
            
            const btnStyleIdle = 'px-4 py-1.5 text-sm font-medium rounded-md text-gray-300 hover:text-white hover:bg-white/10 transition-all flex-1 md:flex-none';
            const btnStyleActive = 'px-4 py-1.5 text-sm font-medium rounded-md bg-white text-nc-primary shadow-sm transition-all flex-1 md:flex-none';
            
            document.getElementById('tab-diario').className = btnStyleIdle;
            document.getElementById('tab-cadastros').className = btnStyleIdle;
            document.getElementById('tab-diario-mobile').className = btnStyleIdle;
            document.getElementById('tab-cadastros-mobile').className = btnStyleIdle;

            document.getElementById('section-' + tab).classList.remove('hidden');
            
            if(tab === 'diario') {
                document.getElementById('tab-diario').className = btnStyleActive;
                document.getElementById('tab-diario-mobile').className = btnStyleActive;
                window.renderPlanilha();
            } else {
                document.getElementById('tab-cadastros').className = btnStyleActive;
                document.getElementById('tab-cadastros-mobile').className = btnStyleActive;
                window.renderCadastros();
            }
        }

        window.gerarId = function() { return Date.now(); }

        window.adicionar = function(tabela, inputId) {
            const input = document.getElementById(inputId);
            if (!input.value.trim()) return window.mostrarToast("O campo não pode estar vazio.", "erro");
            window.dbLocal[tabela].push({ id: window.gerarId(), nome: input.value.trim() });
            input.value = '';
            window.salvarDados();
            window.mostrarToast("Registro salvo.");
        }

        window.adicionarTurma = function() {
            const nome = document.getElementById('nome-turma').value;
            const escolaId = document.getElementById('escola-turma').value;
            if (!nome.trim() || !escolaId) return window.mostrarToast("Selecione a escola e preencha o nome.", "erro");
            window.dbLocal.turmas.push({ id: window.gerarId(), nome: nome.trim(), escolaId: parseInt(escolaId) });
            document.getElementById('nome-turma').value = '';
            window.salvarDados();
            window.mostrarToast("Turma salva.");
        }

        window.adicionarAluno = function() {
            const nome = document.getElementById('nome-aluno').value;
            const turmaId = document.getElementById('turma-aluno').value;
            if (!nome.trim() || !turmaId) return window.mostrarToast("Selecione a turma e preencha o nome.", "erro");
            window.dbLocal.alunos.push({ id: window.gerarId(), nome: nome.trim(), turmaId: parseInt(turmaId) });
            document.getElementById('nome-aluno').value = '';
            window.salvarDados();
            window.mostrarToast("Aluno matriculado.");
        }

        window.remover = function(tabela, id) {
            window.dbLocal[tabela] = window.dbLocal[tabela].filter(item => item.id !== id);
            window.salvarDados();
            window.mostrarToast("Registro removido.");
        }

        window.renderCadastros = function() {
            const renderLista = (tabela, elementoId, infoExtra = null) => {
                const ul = document.getElementById(elementoId);
                ul.innerHTML = '';
                if(window.dbLocal[tabela].length === 0) {
                    ul.innerHTML = '<li class="text-gray-500 text-sm italic py-2">Sem registros.</li>';
                    return;
                }
                window.dbLocal[tabela].forEach(item => {
                    let extra = '';
                    if (infoExtra === 'turma') {
                        const escola = window.dbLocal.escolas.find(e => e.id === item.escolaId);
                        extra = `<span class="text-xs font-medium text-nc-accent bg-blue-50 dark:bg-blue-900/30 px-2 py-0.5 rounded ml-2">${escola ? escola.nome : ''}</span>`;
                    } else if (infoExtra === 'aluno') {
                        const turma = window.dbLocal.turmas.find(t => t.id === item.turmaId);
                        extra = `<span class="text-xs font-medium text-gray-500 dark:text-gray-400 bg-gray-100 dark:bg-slate-700 px-2 py-0.5 rounded ml-2 mt-1 inline-block">${turma ? turma.nome : ''}</span>`;
                    }
                    ul.innerHTML += `
                        <li class="p-3 bg-gray-50 dark:bg-slate-800/50 rounded-lg flex justify-between items-center border border-gray-100 dark:border-slate-700">
                            <div class="flex flex-col sm:flex-row sm:items-center">
                                <span class="text-sm font-semibold text-nc-text dark:text-slate-200">${item.nome}</span>${extra}
                            </div>
                            <button onclick="remover('${tabela}', ${item.id})" class="text-gray-400 hover:text-red-500 p-1" title="Remover">X</button>
                        </li>`;
                });
            };
            renderLista('escolas', 'lista-escolas');
            renderLista('materias', 'lista-materias');
            renderLista('turmas', 'lista-turmas', 'turma');
            renderLista('alunos', 'lista-alunos', 'aluno');
        }

        window.atualizarSelects = function() {
            const preencher = (selectId, dados, placeholder) => {
                const select = document.getElementById(selectId);
                const valorAtual = select.value;
                select.innerHTML = `<option value="">${placeholder}</option>`;
                dados.forEach(item => {
                    let extra = '';
                    if(selectId === 'select-turma-diario' || selectId === 'turma-aluno') {
                        const escola = window.dbLocal.escolas.find(e => e.id === item.escolaId);
                        extra = escola ? ` - ${escola.nome}` : '';
                    }
                    select.innerHTML += `<option value="${item.id}">${item.nome}${extra}</option>`;
                });
                if (dados.find(d => d.id == valorAtual)) select.value = valorAtual;
                else if (dados.length > 0 && selectId === 'select-turma-diario') select.value = dados[0].id;
            };
            preencher('escola-turma', window.dbLocal.escolas, 'Selecione a Escola...');
            preencher('turma-aluno', window.dbLocal.turmas, 'Selecione a Turma...');
            preencher('select-turma-diario', window.dbLocal.turmas, 'Selecione a turma...');
        }

        let turmaAtualId = null;

        window.formatarData = function(dataString) {
            const [ano, mes, dia] = dataString.split('-');
            const dataObj = new Date(ano, mes - 1, dia);
            const diasSemana = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
            return `<div class="font-bold text-[13px]">${dia}/${mes}</div><div class="text-[11px] font-normal mt-0.5">${diasSemana[dataObj.getDay()]}</div>`;
        }

        window.renderPlanilha = function() {
            const turmaSelect = document.getElementById('select-turma-diario').value;
            const mesSelect = document.getElementById('input-mes-diario').value; 
            
            if (!turmaSelect) {
                document.getElementById('tabela-diario').innerHTML = `<tr><td class="p-10 text-center text-gray-500 dark:text-gray-400 bg-gray-50 dark:bg-slate-800/50">Nenhuma turma selecionada.</td></tr>`;
                return;
            }

            turmaAtualId = parseInt(turmaSelect);
            const turma = window.dbLocal.turmas.find(t => t.id === turmaAtualId);
            const escola = window.dbLocal.escolas.find(e => e.id === turma.escolaId);
            const materia = window.dbLocal.materias.length > 0 ? window.dbLocal.materias[0] : {nome: 'CURSO'};
            
            const alunosTurma = window.dbLocal.alunos.filter(a => a.turmaId === turmaAtualId);
            const aulas = window.dbLocal.aulas.filter(a => {
                if (a.turmaId !== turmaAtualId) return false;
                if (mesSelect) return a.data.startsWith(mesSelect);
                return true;
            }).sort((a, b) => a.data.localeCompare(b.data));

            const nomeMes = mesSelect ? new Date(mesSelect + '-01T00:00:00').toLocaleDateString('pt-BR', {month: 'long', year: 'numeric'}) : 'Todas as datas';
            const mesFormatado = nomeMes.charAt(0).toUpperCase() + nomeMes.slice(1).replace(' de ', ' ');

            let html = `
                <thead>
                    <tr><th colspan="${aulas.length + 3}" class="bg-nc-primary text-white p-3 text-center text-xl tracking-wide border-b-[6px] border-nc-accent font-semibold">NEW CODE &middot; Lista de Presença</th></tr>
                    <tr><th colspan="${aulas.length + 3}" class="bg-nc-primary text-white p-2 text-center text-sm font-medium border-b border-gray-600/50">${mesFormatado} &mdash; ${escola ? escola.nome : ''}</th></tr>
                    <tr><th colspan="${aulas.length + 3}" class="bg-nc-primary text-gray-300 p-1.5 text-center text-xs font-normal border-b-[6px] border-nc-accent tracking-wide">${materia.nome} &middot; ${turma.nome}</th></tr>
                    <tr><th class="bg-nc-primary text-white p-3 text-left w-64 text-sm font-bold tracking-wider border-r border-gray-600/30">ALUNO</th>
            `;

            aulas.forEach(aula => {
                html += `<th class="bg-nc-primary text-white p-2 w-16 text-center border-r border-gray-600/30 cursor-pointer hover:bg-nc-primary-hover group relative" title="${aula.conteudo || 'Editar'}" onclick="editarAula(${aula.id})">${window.formatarData(aula.data)}</th>`;
            });
            if(aulas.length === 0) html += `<th class="bg-nc-primary text-gray-400 font-normal text-xs p-2 text-center">Nenhuma aula</th>`;

            html += `
                        <th class="bg-nc-p-header text-white p-2 w-20 text-center text-sm font-bold shadow-inner border-r border-gray-600/30">Total P</th>
                        <th class="bg-nc-f-header text-white p-2 w-20 text-center text-sm font-bold shadow-inner">Total F</th>
                    </tr>
                </thead><tbody class="bg-white dark:bg-slate-800">
            `;

            if(alunosTurma.length === 0) html += `<tr><td colspan="${aulas.length + 3}" class="p-6 text-center text-gray-500 border-b">Sem alunos.</td></tr>`;

            alunosTurma.forEach((aluno, index) => {
                const bgClass = index % 2 === 0 ? 'bg-white dark:bg-slate-800' : 'bg-nc-row-alt dark:bg-slate-700/50';
                let totalP = 0, totalF = 0;
                html += `<tr class="${bgClass}"><td class="p-2.5 font-medium text-nc-text dark:text-slate-200 border-b border-r dark:border-slate-600 text-[13px]">${aluno.nome}</td>`;
                
                if(aulas.length === 0) html += `<td class="border-b border-r border-gray-200 dark:border-slate-600"></td>`;

                aulas.forEach(aula => {
                    const chave = `${aula.id}_${aluno.id}`;
                    const status = window.dbLocal.presencas[chave] || '';
                    if (status === 'P') totalP++;
                    if (status === 'F') totalF++;
                    let textClass = 'text-gray-400 dark:text-gray-500';
                    if(status === 'P') textClass = 'status-p';
                    if(status === 'F') textClass = 'status-f';

                    html += `<td class="p-0 border-b border-r border-gray-200 dark:border-slate-600">
                                <select class="select-status ${textClass} hover:bg-gray-100/50 dark:hover:bg-slate-600/50" onchange="registrarPresenca(${aula.id}, ${aluno.id}, this.value)">
                                    <option value="" ${status === '' ? 'selected' : ''}></option>
                                    <option value="P" ${status === 'P' ? 'selected' : ''}>P</option>
                                    <option value="F" ${status === 'F' ? 'selected' : ''}>F</option>
                                </select>
                             </td>`;
                });
                html += `<td class="p-2 border-b border-r border-gray-300 dark:border-slate-600 bg-nc-p-cell dark:bg-[#2c4c34] text-center"><span class="font-bold text-nc-text dark:text-green-300">${totalP}</span></td>
                         <td class="p-2 border-b border-gray-300 dark:border-slate-600 bg-nc-f-cell dark:bg-[#5c2b2b] text-center"><span class="font-bold text-nc-text dark:text-red-300">${totalF}</span></td></tr>`;
            });

            html += `</tbody>`;
            document.getElementById('tabela-diario').innerHTML = html;
        }

        window.registrarPresenca = function(aulaId, alunoId, status) {
            const chave = `${aulaId}_${alunoId}`;
            window.dbLocal.presencas[chave] = status;
            window.salvarDados(); 
        }

        window.adicionarAula = function() {
            if (!turmaAtualId) return window.mostrarToast("Selecione uma turma.", "erro");
            document.getElementById('modal-data').value = '';
            document.getElementById('modal-conteudo').value = '';
            document.getElementById('modal-aula').dataset.aulaId = '';
            document.getElementById('modal-aula').classList.remove('hidden');
        }

        window.editarAula = function(id) {
            const aula = window.dbLocal.aulas.find(a => a.id === id);
            if(!aula) return;
            document.getElementById('modal-data').value = aula.data;
            document.getElementById('modal-conteudo').value = aula.conteudo;
            document.getElementById('modal-aula').dataset.aulaId = aula.id;
            document.getElementById('modal-aula').classList.remove('hidden');
        }

        window.fecharModal = function() { document.getElementById('modal-aula').classList.add('hidden'); }

        window.salvarAula = function() {
            const data = document.getElementById('modal-data').value;
            const conteudo = document.getElementById('modal-conteudo').value;
            const aulaId = document.getElementById('modal-aula').dataset.aulaId;

            if(!data) return window.mostrarToast("A data é obrigatória.", "erro");

            if(aulaId) {
                const aula = window.dbLocal.aulas.find(a => a.id === parseInt(aulaId));
                aula.data = data;
                aula.conteudo = conteudo;
            } else {
                window.dbLocal.aulas.push({ id: window.gerarId(), turmaId: turmaAtualId, data: data, conteudo: conteudo });
            }
            window.salvarDados();
            window.fecharModal();
        }

        // Sistema de Tema Visual
        window.initTheme = function() {
            const savedTheme = localStorage.getItem('newcode_theme') || 'dark';
            if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
                document.getElementById('icon-sun').classList.remove('hidden');
                document.getElementById('icon-moon').classList.add('hidden');
            } else {
                document.documentElement.classList.add('dark');
                document.getElementById('icon-moon').classList.remove('hidden');
                document.getElementById('icon-sun').classList.add('hidden');
            }
        }

        window.toggleTheme = function() {
            const isDark = document.documentElement.classList.contains('dark');
            if (isDark) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('newcode_theme', 'light');
                document.getElementById('icon-sun').classList.remove('hidden');
                document.getElementById('icon-moon').classList.add('hidden');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('newcode_theme', 'dark');
                document.getElementById('icon-moon').classList.remove('hidden');
                document.getElementById('icon-sun').classList.add('hidden');
            }
        }

        initTheme();
    </script>
</body>
</html>
