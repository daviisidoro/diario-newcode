    <style>
        body { 
            @apply bg-gray-50 text-gray-900 dark:bg-slate-900 dark:text-white;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.2s ease;
        }
        
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { @apply bg-gray-300 dark:bg-slate-600 rounded-full; }

        .app-input {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            padding: 1rem 1.25rem;
            font-size: 1.05rem;
            font-weight: 500;
            border-radius: 0.75rem;
            @apply bg-gray-100 border-transparent text-gray-900 
                   dark:bg-slate-800 dark:border-transparent dark:text-white dark:placeholder-gray-400;
            transition: all 0.2s ease;
        }
        .app-input:focus {
            outline: none;
            @apply ring-2 ring-blue-500 bg-white dark:bg-slate-700;
        }
        
        input[type="month"], input[type="date"] {
            min-height: 3.5rem;
        }

        .app-btn {
            -webkit-appearance: none !important;
            appearance: none !important;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 1rem 1.5rem;
            font-size: 1.125rem;
            font-weight: 800;
            border-radius: 0.75rem;
            border: none;
            background-color: #2563EB !important;
            color: #FFFFFF !important;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.3);
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }
        .app-btn:active { transform: scale(0.98); }
        .app-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

        .app-btn-outline {
            -webkit-appearance: none !important;
            appearance: none !important;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 1rem 1.5rem;
            font-size: 1.05rem;
            font-weight: 800;
            border-radius: 0.75rem;
            background-color: transparent !important;
            border: 2px solid #2563EB !important;
            color: #2563EB !important;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }
        .dark .app-btn-outline {
            border-color: #60A5FA !important;
            color: #60A5FA !important;
        }
        .app-btn-outline:active { transform: scale(0.98); }

        .select-status {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 2.5rem; /* Ajustado para mobile */
            border: none;
            outline: none;
            font-weight: 900;
            font-size: 1rem; /* Ajustado para mobile */
            text-align: center;
            text-align-last: center;
            padding: 0;
            margin: 0;
            cursor: pointer;
        }
        @media (min-width: 640px) {
            .select-status {
                height: 3.5rem;
                font-size: 1.125rem;
            }
        }

        .status-p { 
            @apply bg-green-200 dark:bg-green-700 text-black dark:text-white; 
        }
        .status-f { 
            @apply bg-red-200 dark:bg-red-700 text-black dark:text-white; 
        }
        .status-empty {
            @apply bg-transparent text-gray-400 dark:text-gray-500;
        }

        @keyframes slideInDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .toast-enter { animation: slideInDown 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        .loader-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>

        window.mostrarToast = function(mensagem, tipo = 'sucesso') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgClass = tipo === 'erro' ? 'bg-red-600' : 'bg-gray-900 dark:bg-white';
            let txtClass = tipo === 'erro' ? 'text-white' : 'text-white dark:text-gray-900';
            
            toast.className = `toast-enter ${bgClass} ${txtClass} shadow-xl rounded-full px-5 py-3 flex items-center gap-3 max-w-sm mx-auto font-bold text-sm border border-white/10`;
            toast.innerHTML = `<span>${mensagem}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-20px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 4000); 
        };

        window.toggleAuthMode = function() {
            document.getElementById('form-login').classList.toggle('hidden');
            document.getElementById('form-cadastro').classList.toggle('hidden');
        };

        function setButtonLoading(btnId, isLoading, originalText) {
            const btn = document.getElementById(btnId);
            if (isLoading) {
                btn.disabled = true;
                btn.innerHTML = `<svg class="loader-spin w-6 h-6 text-white mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;
            } else {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        document.getElementById('btn-login').addEventListener('click', async () => {
            const email = document.getElementById('login-email').value.trim();
            const senha = document.getElementById('login-senha').value.trim();
            if (!email || !senha) return window.mostrarToast('Preencha os dados.', 'erro');

            setButtonLoading('btn-login', true, 'Entrar no Sistema');
            try {
                await signInWithEmailAndPassword(auth, email, senha);
                document.getElementById('login-senha').value = '';
            } catch (error) {
                window.mostrarToast('Dados de acesso inválidos.', 'erro');
            }
            setButtonLoading('btn-login', false, 'Entrar no Sistema');
        });

        document.getElementById('btn-cadastro').addEventListener('click', async () => {
            const nome = document.getElementById('cad-nome').value.trim();
            const email = document.getElementById('cad-email').value.trim();
            const senha = document.getElementById('cad-senha').value.trim();

            if (!nome || !email || !senha) return window.mostrarToast('Preencha tudo.', 'erro');
            if (senha.length < 6) return window.mostrarToast('A senha precisa ter pelo menos 6 caracteres.', 'erro');

            setButtonLoading('btn-cadastro', true, 'Registrar e Entrar');
            try {
                const userCred = await createUserWithEmailAndPassword(auth, email, senha);
                await updateProfile(userCred.user, { displayName: nome });
                await setDoc(doc(dbFirestore, "diarios", userCred.user.uid), window.dbLocal);
                window.mostrarToast('Bem-vindo à New Code!');
            } catch (error) {
                window.mostrarToast('Erro ao criar conta. E-mail pode estar em uso.', 'erro');
            }
            setButtonLoading('btn-cadastro', false, 'Registrar e Entrar');
        });

        window.recuperarSenha = async function() {
            const email = document.getElementById('login-email').value.trim();
            if (!email) return window.mostrarToast('Digite o seu e-mail no campo acima primeiro.', 'erro');
            
            try {
                await sendPasswordResetEmail(auth, email);
                window.mostrarToast('Verifique a sua caixa de entrada e SPAM!');
            } catch (error) {
                window.mostrarToast('E-mail não encontrado ou inválido.', 'erro');
            }
        };

        document.getElementById('btn-logout').addEventListener('click', async () => {
            await signOut(auth);
        });

        onAuthStateChanged(auth, (user) => {
            document.getElementById('tela-loading').classList.add('hidden');
            if (user) {
                currentUser = user;
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
                document.getElementById('app-container').classList.add('flex');
                document.getElementById('user-display-name').textContent = user.displayName || 'Professor';
                
                const d = new Date();
                document.getElementById('input-mes-diario').value = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');

                iniciarSincronizacao(user.uid);
            } else {
                currentUser = null;
                if(unsubscribeSnapshot) unsubscribeSnapshot(); 
                document.getElementById('app-container').classList.add('hidden');
                document.getElementById('app-container').classList.remove('flex');
                document.getElementById('auth-container').classList.remove('hidden');
            }
        });

        function iniciarSincronizacao(uid) {
            unsubscribeSnapshot = onSnapshot(doc(dbFirestore, "diarios", uid), (docSnap) => {
                if (docSnap.exists()) {
                    const d = docSnap.data();
                    window.dbLocal = { 
                        escolas: d.escolas||[], 
                        materias: d.materias||[], 
                        turmas: d.turmas||[], 
                        alunos: d.alunos||[], 
                        aulas: d.aulas||[], 
                        presencas: d.presencas||{} 
                    };
                } else {
                    window.dbLocal = { escolas: [], materias: [], turmas: [], alunos: [], aulas: [], presencas: {} };
                    setDoc(doc(dbFirestore, "diarios", uid), window.dbLocal);
                }
                document.getElementById('status-nuvem').classList.remove('hidden');
                window.atualizarSelects();
                window.renderCadastros();
                window.renderPlanilha();
            });
        }

        window.salvarDados = async function() {
            if (!currentUser) return;
            document.getElementById('status-nuvem').classList.add('hidden'); 
            await setDoc(doc(dbFirestore, "diarios", currentUser.uid), window.dbLocal);
        };

        window.changeTab = function(tab) {
            document.getElementById('section-diario').classList.add('hidden');
            document.getElementById('section-cadastros').classList.add('hidden');
            
            const baseClass = "flex-1 py-2.5 text-sm font-bold rounded-lg text-center transition-all duration-200 ";
            const activeClass = baseClass + "bg-white dark:bg-slate-600 text-blue-600 dark:text-white shadow-sm";
            const inactiveClass = baseClass + "text-gray-500 dark:text-gray-400 bg-transparent hover:text-gray-700 dark:hover:text-gray-300";

            document.getElementById('tab-diario').className = (tab === 'diario') ? activeClass : inactiveClass;
            document.getElementById('tab-cadastros').className = (tab === 'cadastros') ? activeClass : inactiveClass;

            document.getElementById('section-' + tab).classList.remove('hidden');

            if(tab === 'cadastros') {
                cancelarEdicao(); 
                window.renderCadastros();
            }
            if(tab === 'diario') window.renderPlanilha();
        };

        window.gerarId = function() { return Date.now(); };

        function cancelarEdicao() {
            modoEdicao = { ativo: false, tabela: null, id: null };
            document.getElementById('btn-add-escola').innerText = "+";
            document.getElementById('btn-add-materia').innerText = "+";
            document.getElementById('btn-add-turma').innerText = "+";
            document.getElementById('btn-add-aluno').innerText = "+";
            
            document.getElementById('nome-escola').value = '';
            document.getElementById('nome-materia').value = '';
            document.getElementById('nome-turma').value = '';
            document.getElementById('nome-aluno').value = '';
            document.getElementById('demo-aluno').checked = false;
        }

        window.iniciarEdicao = function(tabela, id) {
            const item = window.dbLocal[tabela].find(i => i.id === id);
            if (!item) return;

            cancelarEdicao();
            modoEdicao = { ativo: true, tabela: tabela, id: id };

            if (tabela === 'escolas') {
                document.getElementById('nome-escola').value = item.nome;
                document.getElementById('nome-escola').focus();
                document.getElementById('btn-add-escola').innerText = "✓";
            } else if (tabela === 'materias') {
                document.getElementById('nome-materia').value = item.nome;
                document.getElementById('nome-materia').focus();
                document.getElementById('btn-add-materia').innerText = "✓";
            } else if (tabela === 'turmas') {
                document.getElementById('escola-turma').value = item.escolaId || "";
                document.getElementById('materia-turma').value = item.materiaId || "";
                document.getElementById('nome-turma').value = item.nome;
                document.getElementById('nome-turma').focus();
                document.getElementById('btn-add-turma').innerText = "✓";
            } else if (tabela === 'alunos') {
                const turma = window.dbLocal.turmas.find(t => t.id === item.turmaId);
                if (turma) {
                    document.getElementById('escola-aluno').value = turma.escolaId || "";
                    window.atualizarSelectTurmasAluno();
                }
                document.getElementById('turma-aluno').value = item.turmaId || "";
                document.getElementById('nome-aluno').value = item.nome;
                document.getElementById('demo-aluno').checked = !!item.isDemo;
                document.getElementById('nome-aluno').focus();
                document.getElementById('btn-add-aluno').innerText = "✓";
            }
            
            window.mostrarToast('Modo de edição. Altere os dados e guarde.');
        };

        window.toggleDemo = function(id) {
            const aluno = window.dbLocal.alunos.find(a => a.id === id);
            if (aluno) {
                aluno.isDemo = !aluno.isDemo;
                window.salvarDados();
                window.renderCadastros();
                window.renderPlanilha();
            }
        };

        window.adicionar = function(tabela, inputId) {
            const val = document.getElementById(inputId).value.trim();
            if (!val) return window.mostrarToast('O campo não pode estar vazio.', 'erro');
            
            if (modoEdicao.ativo && modoEdicao.tabela === tabela) {
                const item = window.dbLocal[tabela].find(i => i.id === modoEdicao.id);
                if(item) item.nome = val;
                window.mostrarToast('Registro atualizado.');
            } else {
                window.dbLocal[tabela].push({ id: window.gerarId(), nome: val });
                window.mostrarToast('Registro adicionado.');
            }
            
            cancelarEdicao();
            window.salvarDados();
        };

        window.adicionarTurma = function() {
            const nome = document.getElementById('nome-turma').value.trim();
            const escId = document.getElementById('escola-turma').value;
            const matId = document.getElementById('materia-turma').value; 
            if (!nome || !escId || !matId) return window.mostrarToast('Selecione escola, curso e nome.', 'erro');
            
            if (modoEdicao.ativo && modoEdicao.tabela === 'turmas') {
                const item = window.dbLocal.turmas.find(i => i.id === modoEdicao.id);
                if(item) {
                    item.nome = nome;
                    item.escolaId = parseInt(escId);
                    item.materiaId = parseInt(matId);
                }
                window.mostrarToast('Turma atualizada.');
            } else {
                window.dbLocal.turmas.push({ id: window.gerarId(), nome, escolaId: parseInt(escId), materiaId: parseInt(matId) });
                window.mostrarToast('Turma cadastrada.');
            }
            
            cancelarEdicao();
            window.salvarDados();
        };

        window.adicionarAluno = function() {
            const nome = document.getElementById('nome-aluno').value.trim();
            const turId = document.getElementById('turma-aluno').value;
            const isDemo = document.getElementById('demo-aluno').checked;
            
            if (!nome || !turId) return window.mostrarToast('Selecione a turma e digite o nome.', 'erro');
            
            if (modoEdicao.ativo && modoEdicao.tabela === 'alunos') {
                const item = window.dbLocal.alunos.find(i => i.id === modoEdicao.id);
                if(item) {
                    item.nome = nome;
                    item.turmaId = parseInt(turId);
                    item.isDemo = isDemo;
                }
                window.mostrarToast('Aluno atualizado.');
            } else {
                window.dbLocal.alunos.push({ id: window.gerarId(), nome, turmaId: parseInt(turId), isDemo });
                window.mostrarToast('Aluno matriculado.');
            }

            cancelarEdicao();
            window.salvarDados();
        };

        window.remover = function(tabela, id) {
            if(confirm("Tem certeza que deseja apagar? Esta ação não pode ser desfeita.")) {
                window.dbLocal[tabela] = window.dbLocal[tabela].filter(i => i.id !== id);
                if(modoEdicao.id === id) cancelarEdicao();
                window.salvarDados();
            }
        };

        window.renderCadastros = function() {
            const renderLista = (tabela, elId, arr, infoExtra = null) => {
                const ul = document.getElementById(elId);
                ul.innerHTML = '';
                if (arr.length === 0) return ul.innerHTML = `<li class="p-4 text-sm font-bold text-gray-400 text-center border-2 border-dashed border-gray-200 dark:border-slate-700 rounded-xl">Sem registros</li>`;

                arr.forEach(item => {
                    let extra = '';
                    let btnDemo = '';
                    
                    if (infoExtra === 'turma') {
                        const m = window.dbLocal.materias.find(x => x.id === item.materiaId);
                        extra = `<span class="text-[11px] font-black uppercase tracking-wider text-blue-600 dark:text-blue-400 bg-blue-100 dark:bg-slate-700 px-2 py-0.5 rounded-md mt-1 inline-block">${m ? m.nome : 'Sem Curso'}</span>`;
                    } else if (infoExtra === 'aluno') {
                        const t = window.dbLocal.turmas.find(x => x.id === item.turmaId);
                        extra = `<span class="text-[11px] font-black uppercase tracking-wider text-gray-600 dark:text-gray-300 bg-gray-200 dark:bg-slate-600 px-2 py-0.5 rounded-md mt-1 inline-block">${t ? t.nome : 'Turma Apagada'}</span>`;
                        
                        if (item.isDemo) {
                            extra += ` <span class="text-[11px] font-black uppercase tracking-wider text-purple-600 dark:text-purple-400 bg-purple-100 dark:bg-slate-700 border border-purple-200 dark:border-purple-600 px-2 py-0.5 rounded-md mt-1 inline-block ml-1">DEMO</span>`;
                        }
                        
                        const demoColor = item.isDemo ? 'text-purple-600 dark:text-purple-400 bg-purple-50 dark:bg-purple-900/20' : 'text-gray-400 hover:text-purple-600 hover:bg-white dark:hover:bg-slate-800';
                        btnDemo = `
                            <button onclick="window.toggleDemo(${item.id})" class="w-8 h-8 rounded-lg flex items-center justify-center transition-all ${demoColor}" title="Alternar Demo">
                                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                            </button>
                        `;
                    }
                    
                    const safeName = item.nome.replace(/'/g, "\\'");
                    
                    ul.innerHTML += `
                        <li class="p-4 bg-gray-50 dark:bg-slate-900/50 border border-gray-200 dark:border-slate-700 rounded-xl flex justify-between items-center mb-3">
                            <div class="flex flex-col">
                                <span class="text-sm font-black text-gray-900 dark:text-white">${item.nome}</span>
                                <div>${extra}</div>
                            </div>
                            <div class="flex gap-1">
                                ${btnDemo}
                                <button onclick="window.iniciarEdicao('${tabela}', ${item.id})" class="w-8 h-8 rounded-lg flex items-center justify-center text-gray-400 hover:text-blue-600 hover:bg-white dark:hover:bg-slate-800 transition-all" title="Editar">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                                </button>
                                <button onclick="window.remover('${tabela}', ${item.id})" class="w-8 h-8 rounded-lg flex items-center justify-center text-gray-400 hover:text-red-600 hover:bg-white dark:hover:bg-slate-800 transition-all" title="Apagar">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                </button>
                            </div>
                        </li>`;
                });
            };

            const ordEsc = [...window.dbLocal.escolas].sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR'));
            const ordMat = [...window.dbLocal.materias].sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR'));
            
            renderLista('escolas', 'lista-escolas', ordEsc);
            renderLista('materias', 'lista-materias', ordMat);

            const escFiltro = document.getElementById('escola-turma').value;
            if (escFiltro) {
                let tArr = window.dbLocal.turmas.filter(t => t.escolaId == parseInt(escFiltro));
                renderLista('turmas', 'lista-turmas', tArr.sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR')), 'turma');
            } else {
                document.getElementById('lista-turmas').innerHTML = `<li class="p-4 text-sm font-bold text-gray-400 text-center border-2 border-dashed border-gray-200 dark:border-slate-700 rounded-xl">Selecione uma escola acima para ver as turmas</li>`;
            }

            const escAlunoFiltro = document.getElementById('escola-aluno').value;
            const turFiltro = document.getElementById('turma-aluno').value;
            if (escAlunoFiltro && turFiltro) {
                let aArr = window.dbLocal.alunos.filter(a => a.turmaId == parseInt(turFiltro));
                renderLista('alunos', 'lista-alunos', aArr.sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR')), 'aluno');
            } else {
                document.getElementById('lista-alunos').innerHTML = `<li class="p-4 text-sm font-bold text-gray-400 text-center border-2 border-dashed border-gray-200 dark:border-slate-700 rounded-xl">Selecione uma escola e turma acima</li>`;
            }
        };

        window.atualizarSelects = function() {
            const preencher = (selectId, dados, placeholder) => {
                const select = document.getElementById(selectId);
                const valorAtual = select.value;
                select.innerHTML = `<option value="">${placeholder}</option>`;
                
                const sortedDados = [...dados].sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR'));
                
                sortedDados.forEach(item => {
                    select.innerHTML += `<option value="${item.id}">${item.nome}</option>`;
                });
                
                if (sortedDados.find(d => d.id == valorAtual)) select.value = valorAtual;
            };
            
            preencher('escola-turma', window.dbLocal.escolas, 'Selecionar Escola...');
            preencher('materia-turma', window.dbLocal.materias, 'Selecionar Curso...');
            preencher('escola-aluno', window.dbLocal.escolas, 'Selecionar Escola...');
            preencher('select-escola-diario', window.dbLocal.escolas, 'Selecionar Escola...');
            
            window.atualizarSelectTurmasAluno();
            window.atualizarSelectTurmasDiario();
        };

        window.atualizarSelectTurmasAluno = function() {
            const escolaId = document.getElementById('escola-aluno').value;
            const select = document.getElementById('turma-aluno');
            const valorAtual = select.value;
            
            select.innerHTML = `<option value="">Selecionar Turma...</option>`;
            
            if (escolaId) {
                const turmas = window.dbLocal.turmas.filter(t => t.escolaId == parseInt(escolaId));
                const sorted = [...turmas].sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR'));
                
                sorted.forEach(t => {
                    select.innerHTML += `<option value="${t.id}">${t.nome}</option>`;
                });
                
                if (sorted.find(d => d.id == valorAtual)) select.value = valorAtual;
            }
            window.renderCadastros();
        };

        window.atualizarSelectTurmasDiario = function() {
            const escolaId = document.getElementById('select-escola-diario').value;
            const select = document.getElementById('select-turma-diario');
            const valorAtual = select.value;
            
            select.innerHTML = `<option value="">Selecionar Turma...</option>`;
            
            if (escolaId) {
                const turmas = window.dbLocal.turmas.filter(t => t.escolaId == parseInt(escolaId));
                const sorted = [...turmas].sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR'));
                
                sorted.forEach(t => {
                    select.innerHTML += `<option value="${t.id}">${t.nome}</option>`;
                });
                
                if (sorted.find(d => d.id == valorAtual)) select.value = valorAtual;
            }
            window.renderPlanilha();
        };

        window.formatarData = function(dataString) {
            const [ano, mes, dia] = dataString.split('-');
            const dataObj = new Date(ano, mes - 1, dia);
            const dias = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
            return `<div class="font-black text-xs sm:text-base">${dia}/${mes}</div><div class="text-[8px] sm:text-[10px] font-bold uppercase tracking-widest mt-0.5 sm:mt-1 text-gray-400">${dias[dataObj.getDay()]}</div>`;
        };

        let turmaAtualId = null;

        window.renderPlanilha = function() {
            const escolaSelect = document.getElementById('select-escola-diario').value;
            const turmaSelect = document.getElementById('select-turma-diario').value;
            const mesSelect = document.getElementById('input-mes-diario').value; 
            
            if (!escolaSelect || !turmaSelect) {
                document.getElementById('tabela-diario').innerHTML = `<tr><td class="p-10 text-center text-gray-500 font-bold">Selecione uma escola e uma turma acima.</td></tr>`;
                return;
            }

            turmaAtualId = parseInt(turmaSelect);
            const turma = window.dbLocal.turmas.find(t => t.id === turmaAtualId);
            const escola = window.dbLocal.escolas.find(e => e.id === turma.escolaId);
            const materia = window.dbLocal.materias.find(m => m.id === turma.materiaId) || {nome: 'Geral'};
            
            const alunosTurma = window.dbLocal.alunos.filter(a => a.turmaId === turmaAtualId).sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR'));
            const aulas = window.dbLocal.aulas.filter(a => a.turmaId === turmaAtualId && (!mesSelect || a.data.startsWith(mesSelect))).sort((a, b) => a.data.localeCompare(b.data));

            const nomeMes = mesSelect ? new Date(mesSelect + '-01T00:00:00').toLocaleDateString('pt-BR', {month: 'long', year: 'numeric'}) : 'Todas as datas';

            let html = `
                <thead>
                    <tr class="bg-gray-50 dark:bg-slate-800/80 border-b border-gray-200 dark:border-slate-700">
                        <th colspan="${aulas.length + 3}" class="p-3 sm:p-5 text-left">
                            <div class="font-black text-xl sm:text-2xl text-gray-900 dark:text-white capitalize mb-2">${nomeMes}</div>
                            <div class="flex flex-wrap items-center gap-2 text-[10px] sm:text-xs font-black text-gray-500 dark:text-gray-400 uppercase tracking-wider">
                                <span class="bg-white dark:bg-slate-900 px-2 py-1 rounded-md border border-gray-200 dark:border-slate-700">${escola ? escola.nome : 'Sem Escola'}</span>
                                <span class="bg-blue-100 text-blue-700 dark:bg-slate-700 dark:text-blue-400 px-2 py-1 rounded-md">${materia.nome}</span>
                                <span class="bg-white dark:bg-slate-900 px-2 py-1 rounded-md border border-gray-200 dark:border-slate-700">${turma.nome}</span>
                            </div>
                        </th>
                    </tr>
                    <tr class="bg-white dark:bg-slate-900 border-b border-gray-200 dark:border-slate-700 text-gray-500 dark:text-gray-400">
                        <th class="p-2 sm:p-4 text-left text-[10px] sm:text-[11px] font-black tracking-widest uppercase border-r border-gray-200 dark:border-slate-700 w-1/3 sm:w-auto truncate max-w-[120px] sm:max-w-none">Aluno</th>
            `;

            aulas.forEach(aula => {
                html += `<th class="p-1 sm:p-2 w-10 sm:w-16 text-center border-r border-gray-200 dark:border-slate-700 cursor-pointer hover:bg-gray-100 dark:hover:bg-slate-800 transition-colors" title="${aula.conteudo || 'Editar Aula'}" onclick="window.editarAula(${aula.id})">${window.formatarData(aula.data)}</th>`;
            });

            html += `
                        <th class="p-1 sm:p-3 w-8 sm:w-16 text-center text-[9px] sm:text-[10px] font-black uppercase tracking-widest border-r border-gray-200 dark:border-slate-700 text-green-600 dark:text-green-500">Pres</th>
                        <th class="p-1 sm:p-3 w-8 sm:w-16 text-center text-[9px] sm:text-[10px] font-black uppercase tracking-widest text-red-600 dark:text-red-500">Falta</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200 dark:divide-slate-700">
            `;

            if (alunosTurma.length === 0) html += `<tr><td colspan="${aulas.length + 3}" class="p-8 text-center text-gray-400 font-bold">Nenhum aluno matriculado nesta turma.</td></tr>`;

            alunosTurma.forEach((aluno) => {
                let tP = 0, tF = 0;
                
                html += `<tr class="hover:bg-gray-50 dark:hover:bg-slate-800/50 transition-colors">
                            <td class="p-2 sm:p-4 border-r border-gray-200 dark:border-slate-700 max-w-[120px] sm:max-w-none truncate">
                                <div class="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-2 truncate">
                                    <span class="font-black text-gray-800 dark:text-white text-xs sm:text-sm truncate" title="${aluno.nome}">${aluno.nome}</span>
                                    ${aluno.isDemo ? `<span class="px-1.5 py-0.5 rounded text-[8px] sm:text-[9px] font-black uppercase tracking-wider text-purple-700 dark:text-purple-400 bg-purple-100 dark:bg-slate-800 border border-purple-200 dark:border-purple-700 w-max">Demo</span>` : ''}
                                </div>
                            </td>`;

                aulas.forEach(aula => {
                    const status = window.dbLocal.presencas[`${aula.id}_${aluno.id}`] || '';
                    if (status === 'P') tP++;
                    if (status === 'F') tF++;
                    
                    let c = status === 'P' ? 'status-p' : (status === 'F' ? 'status-f' : 'status-empty');

                    html += `<td class="p-0 border-r border-gray-200 dark:border-slate-700 relative align-middle">
                                <select class="select-status ${c}" onchange="window.registrarPresenca(${aula.id}, ${aluno.id}, this.value)">
                                    <option value="" ${!status?'selected':''}>-</option>
                                    <option value="P" ${status==='P'?'selected':''}>P</option>
                                    <option value="F" ${status==='F'?'selected':''}>F</option>
                                </select>
                             </td>`;
                });

                html += `<td class="p-1 sm:p-0 border-r border-gray-200 dark:border-slate-700 text-center font-black text-green-700 dark:text-green-400 bg-green-50 dark:bg-green-900/20 text-sm sm:text-base">${tP}</td>
                         <td class="p-1 sm:p-0 text-center font-black text-red-700 dark:text-red-400 bg-red-50 dark:bg-red-900/20 text-sm sm:text-base">${tF}</td></tr>`;
            });

            html += `</tbody>`;
            document.getElementById('tabela-diario').innerHTML = html;
        };

        window.registrarPresenca = function(aulaId, alunoId, status) {
            window.dbLocal.presencas[`${aulaId}_${alunoId}`] = status;
            window.salvarDados(); 
        };

        window.adicionarAula = function() {
            if (!turmaAtualId) return window.mostrarToast('Selecione uma turma.', 'erro');
            document.getElementById('modal-data').value = '';
            document.getElementById('modal-conteudo').value = '';
            document.getElementById('modal-aula').dataset.aulaId = '';
            document.getElementById('modal-aula').classList.remove('hidden');
        };

        window.editarAula = function(id) {
            const aula = window.dbLocal.aulas.find(a => a.id === id);
            if(!aula) return;
            document.getElementById('modal-data').value = aula.data;
            document.getElementById('modal-conteudo').value = aula.conteudo;
            document.getElementById('modal-aula').dataset.aulaId = aula.id;
            document.getElementById('modal-aula').classList.remove('hidden');
        };

        window.fecharModal = function() { document.getElementById('modal-aula').classList.add('hidden'); };

        window.salvarAula = function() {
            const data = document.getElementById('modal-data').value;
            const conteudo = document.getElementById('modal-conteudo').value;
            const aulaId = document.getElementById('modal-aula').dataset.aulaId;
            if(!data) return window.mostrarToast('Data é obrigatória.', 'erro');

            if(aulaId) {
                const aula = window.dbLocal.aulas.find(a => a.id === parseInt(aulaId));
                aula.data = data; aula.conteudo = conteudo;
            } else {
                window.dbLocal.aulas.push({ id: window.gerarId(), turmaId: turmaAtualId, data, conteudo });
            }
            window.salvarDados();
            window.fecharModal();
        };

        window.initTheme = function() {
            if (localStorage.getItem('newcode_theme') === 'light') {
                document.documentElement.classList.remove('dark');
                document.getElementById('icon-sun').classList.remove('hidden');
            } else {
                document.documentElement.classList.add('dark');
                document.getElementById('icon-moon').classList.remove('hidden');
            }
        };

        window.toggleTheme = function() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('newcode_theme', 'light');
                document.getElementById('icon-sun').classList.remove('hidden');
                document.getElementById('icon-moon').classList.add('hidden');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('newcode_theme', 'dark');
                document.getElementById('icon-moon').classList.remove('hidden');
                document.getElementById('icon-sun').classList.add('hidden');
            }
        };

        window.initTheme();
    </script>
</body>
</html>
