<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEW CODE - Diário Escolar</title>
    
    <!-- Configurações de Ícone e Tela de Início para Mobile -->

    <link rel="apple-touch-icon" href="icone.png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'nc-dark': '#0B1320',
                        'nc-primary': '#1A2E4C',
                        'nc-primary-hover': '#254069',
                        'nc-accent': '#5CB4CD',
                        'nc-bg': '#F1F5F9',
                        'nc-surface': '#FFFFFF',
                        'nc-text': '#334155',
                        'nc-border': '#E2E8F0',
                        'nc-row-alt': '#F0F4F8',
                        'nc-p-header': '#528251',
                        'nc-p-cell': '#D9EAD8',
                        'nc-p-text': '#166534',
                        'nc-f-header': '#B9634C',
                        'nc-f-cell': '#F7D7D7',
                        'nc-f-text': '#991B1B',
                    }
                }

    <style>
        body { 
            @apply bg-nc-bg text-nc-text dark:bg-slate-900 dark:text-slate-200;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { @apply bg-slate-300 dark:bg-slate-600 rounded; }
        ::-webkit-scrollbar-thumb:hover { @apply bg-slate-400 dark:bg-slate-500; }

        .modern-input {
            width: 100%;
            padding: 0.625rem 0.875rem;
            @apply bg-slate-50 border-slate-200 text-slate-700 dark:bg-slate-900 dark:border-slate-700 dark:text-slate-200;
            border-width: 1px;
            border-style: solid;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            transition: all 0.2s ease;
        }
        .modern-input:focus {
            outline: none;
            @apply border-nc-accent dark:border-nc-accent ring-2 ring-nc-accent/20 dark:ring-nc-accent/20;
            @apply bg-white dark:bg-slate-800;
        }

        .modern-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.625rem 1.25rem;
            font-size: 0.875rem;
            font-weight: 600;
            border-radius: 0.5rem;
            transition: all 0.2s;
            cursor: pointer;
        }
        .btn-primary { background-color: #1A2E4C; color: white; }
        .btn-primary:hover:not(:disabled) { background-color: #254069; transform: translateY(-1px); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }

        .select-status {
            appearance: none;
            background-color: transparent;
            border: none;
            width: 100%;
            height: 100%;
            text-align: center;
            font-weight: 700;
            cursor: pointer;
            outline: none;
            font-size: 0.875rem;
            padding: 0.5rem;
        }
        .status-p { @apply text-green-700 dark:text-green-400; }
        .status-f { @apply text-red-700 dark:text-red-400; }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .toast-enter { animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        
        .loader-spin {
            animation: spin 1s linear infinite;
        }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- SCRIPT DE LÓGICA E INTEGRAÇÃO FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // CREDENCIAIS FIREBASE 
        const firebaseConfig = {
            apiKey: "AIzaSyDUYpc-GItAeunBFFvaz6ByaFnJ7yxYji0",
            authDomain: "diario-newcode.firebaseapp.com",
            projectId: "diario-newcode",
            storageBucket: "diario-newcode.firebasestorage.app",
            messagingSenderId: "440225334729",
            appId: "1:440225334729:web:6e2fc05a88502c3ff69418",
            measurementId: "G-1TQE6YPV6N"
        };

        // INICIALIZAÇÃO
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const dbFirestore = getFirestore(app);

        // VARIÁVEIS GLOBAIS DE ESTADO
        window.dbLocal = { escolas: [], materias: [], turmas: [], alunos: [], aulas: [], presencas: {} };
        let currentUser = null;
        let unsubscribeSnapshot = null;

        // UI: FUNÇÃO DE TOAST DISPONÍVEL GLOBALMENTE
        window.mostrarToast = function(mensagem, tipo = 'sucesso') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgClass = 'bg-white dark:bg-slate-800 border-l-4';
            let borderClass = tipo === 'erro' ? 'border-red-500' : 'border-green-500';
            let icon = tipo === 'erro' 
                ? `<svg class="w-5 h-5 text-red-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`
                : `<svg class="w-5 h-5 text-green-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;

            toast.className = `toast-enter ${bgClass} ${borderClass} shadow-lg rounded-r-md p-4 flex items-center gap-3`;
            toast.innerHTML = `${icon} <span class="text-sm font-medium text-gray-700 dark:text-gray-200">${mensagem}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 5000); 
        };

        // UI: ALTERNAR LOGIN/CADASTRO
        window.toggleAuthMode = function() {
            document.getElementById('form-login').classList.toggle('hidden');
            document.getElementById('form-cadastro').classList.toggle('hidden');
        };

        // UTILIDADE DE LOADING DE BOTÃO
        function setButtonLoading(btnId, isLoading, originalText) {
            const btn = document.getElementById(btnId);
            if (isLoading) {
                btn.disabled = true;
                btn.innerHTML = `<svg class="loader-spin w-5 h-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;
            } else {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        // EVENTOS DE AUTENTICAÇÃO
        document.getElementById('btn-login').addEventListener('click', async () => {
            const email = document.getElementById('login-email').value.trim();
            const senha = document.getElementById('login-senha').value.trim();

            if (!email || !senha) return window.mostrarToast('Preencha o e-mail e a senha.', 'erro');

            setButtonLoading('btn-login', true, 'Acessar Sistema');
            try {
                await signInWithEmailAndPassword(auth, email, senha);
                document.getElementById('login-senha').value = '';
            } catch (error) {
                console.error(error);
                if (error.code === 'auth/invalid-credential') {
                    window.mostrarToast('E-mail ou senha incorretos.', 'erro');
                } else {
                    window.mostrarToast('ERRO: ' + error.code, 'erro');
                }
            }
            setButtonLoading('btn-login', false, 'Acessar Sistema');
        });

        document.getElementById('btn-cadastro').addEventListener('click', async () => {
            const nome = document.getElementById('cad-nome').value.trim();
            const email = document.getElementById('cad-email').value.trim();
            const senha = document.getElementById('cad-senha').value.trim();

            if (!nome || !email || !senha) return window.mostrarToast('Preencha todos os campos.', 'erro');
            if (senha.length < 6) return window.mostrarToast('A senha precisa ter pelo menos 6 caracteres.', 'erro');

            setButtonLoading('btn-cadastro', true, 'Registrar e Acessar');
            try {
                const userCred = await createUserWithEmailAndPassword(auth, email, senha);
                await updateProfile(userCred.user, { displayName: nome });
                
                await setDoc(doc(dbFirestore, "diarios", userCred.user.uid), window.dbLocal);
                window.mostrarToast('Conta criada com sucesso!');
                
                document.getElementById('cad-nome').value = '';
                document.getElementById('cad-email').value = '';
                document.getElementById('cad-senha').value = '';
            } catch (error) {
                console.error("Erro Firebase Detalhado: ", error);
                window.mostrarToast('ERRO: ' + error.code, 'erro');
            }
            setButtonLoading('btn-cadastro', false, 'Registrar e Acessar');
        });

        document.getElementById('btn-logout').addEventListener('click', async () => {
            try {
                await signOut(auth);
                window.mostrarToast('Sessão encerrada com sucesso.');
            } catch (error) {
                window.mostrarToast('Erro ao sair da conta.', 'erro');
            }
        });

        // MONITORAMENTO DO ESTADO DO USUÁRIO
        onAuthStateChanged(auth, (user) => {
            const telaLoading = document.getElementById('tela-loading');
            const telaAuth = document.getElementById('auth-container');
            const telaAppHeader = document.getElementById('app-header');
            const telaAppMain = document.getElementById('app-main');
            
            telaLoading.classList.add('hidden');

            if (user) {
                currentUser = user;
                telaAuth.classList.add('hidden');
                telaAppHeader.classList.remove('hidden');
                telaAppMain.classList.remove('hidden');
                
                document.getElementById('user-display-name').textContent = user.displayName || 'Professor';
                
                const dataAtual = new Date();
                const mesFormatado = dataAtual.getFullYear() + '-' + String(dataAtual.getMonth() + 1).padStart(2, '0');
                document.getElementById('input-mes-diario').value = mesFormatado;

                iniciarSincronizacao(user.uid);
            } else {
                currentUser = null;
                if(unsubscribeSnapshot) unsubscribeSnapshot(); 
                
                telaAppHeader.classList.add('hidden');
                telaAppMain.classList.add('hidden');
                telaAuth.classList.remove('hidden');
            }
        });

        // ================= SINCRONIZAÇÃO FIRESTORE =================
        function iniciarSincronizacao(uid) {
            const docRef = doc(dbFirestore, "diarios", uid);
            
            unsubscribeSnapshot = onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const dadosNuvem = docSnap.data();
                    window.dbLocal = {
                        escolas: dadosNuvem.escolas || [],
                        materias: dadosNuvem.materias || [],
                        turmas: dadosNuvem.turmas || [],
                        alunos: dadosNuvem.alunos || [],
                        aulas: dadosNuvem.aulas || [],
                        presencas: dadosNuvem.presencas || {}
                    };
                } else {
                    window.dbLocal = { escolas: [], materias: [], turmas: [], alunos: [], aulas: [], presencas: {} };
                    setDoc(docRef, window.dbLocal).catch(console.error);
                }
                
                document.getElementById('status-nuvem').classList.remove('hidden');
                
                window.atualizarSelects();
                window.renderCadastros();
                window.renderPlanilha();
            }, (error) => {
                console.error("Erro na sincronização:", error);
                window.mostrarToast("Erro ao sincronizar com a nuvem.", "erro");
            });
        }

        window.salvarDados = async function() {
            if (!currentUser) return;
            document.getElementById('status-nuvem').classList.add('hidden'); 
            try {
                const docRef = doc(dbFirestore, "diarios", currentUser.uid);
                await setDoc(docRef, window.dbLocal);
            } catch (error) {
                console.error(error);
                window.mostrarToast("Erro ao salvar dados na nuvem.", "erro");
            }
        };

        // ================= LÓGICA DO DIÁRIO (CRUD) =================
        window.changeTab = function(tab) {
            document.getElementById('section-diario').classList.add('hidden');
            document.getElementById('section-cadastros').classList.add('hidden');
            
            document.getElementById('tab-diario').className = 'px-3 sm:px-4 py-1.5 text-xs sm:text-sm font-medium rounded-md text-gray-300 hover:text-white hover:bg-white/10 transition-all';
            document.getElementById('tab-cadastros').className = 'px-3 sm:px-4 py-1.5 text-xs sm:text-sm font-medium rounded-md text-gray-300 hover:text-white hover:bg-white/10 transition-all';

            document.getElementById('section-' + tab).classList.remove('hidden');
            document.getElementById('tab-' + tab).className = 'px-3 sm:px-4 py-1.5 text-xs sm:text-sm font-medium rounded-md bg-white text-nc-primary shadow-sm transition-all';

            if(tab === 'cadastros') window.renderCadastros();
            if(tab === 'diario') window.renderPlanilha();
        };

        window.gerarId = function() { return Date.now(); };

        window.adicionar = function(tabela, inputId) {
            const input = document.getElementById(inputId);
            if (!input.value.trim()) return window.mostrarToast('Por favor, preencha o campo.', 'erro');
            
            window.dbLocal[tabela].push({ id: window.gerarId(), nome: input.value.trim() });
            input.value = '';
            window.salvarDados();
            window.mostrarToast('Registro adicionado.');
        };

        window.adicionarTurma = function() {
            const nome = document.getElementById('nome-turma').value;
            const escolaId = document.getElementById('escola-turma').value;
            if (!nome.trim() || !escolaId) return window.mostrarToast('Selecione uma escola e informe os dados.', 'erro');
            
            window.dbLocal.turmas.push({ id: window.gerarId(), nome: nome.trim(), escolaId: parseInt(escolaId) });
            document.getElementById('nome-turma').value = '';
            window.salvarDados();
            window.mostrarToast('Turma cadastrada.');
        };

        window.adicionarAluno = function() {
            const nome = document.getElementById('nome-aluno').value;
            const turmaId = document.getElementById('turma-aluno').value;
            if (!nome.trim() || !turmaId) return window.mostrarToast('Selecione a turma e digite o nome.', 'erro');
            
            window.dbLocal.alunos.push({ id: window.gerarId(), nome: nome.trim(), turmaId: parseInt(turmaId) });
            document.getElementById('nome-aluno').value = '';
            window.salvarDados();
            window.mostrarToast('Aluno matriculado.');
        };

        window.remover = function(tabela, id) {
            window.dbLocal[tabela] = window.dbLocal[tabela].filter(item => item.id !== id);
            window.salvarDados();
            window.mostrarToast('Registro removido.');
        };

        window.renderCadastros = function() {
            const renderLista = (tabela, elementoId, arrayDeDados, infoExtra = null) => {
                const ul = document.getElementById(elementoId);
                ul.innerHTML = '';
                
                if (arrayDeDados.length === 0) {
                    ul.innerHTML = `<li class="p-3 text-center text-gray-400 italic text-sm">Nenhum registro encontrado para a seleção atual.</li>`;
                    return;
                }

                arrayDeDados.forEach(item => {
                    let extra = '';
                    if (infoExtra === 'turma') {
                        const escola = window.dbLocal.escolas.find(e => e.id === item.escolaId);
                        extra = `<span class="text-xs font-medium text-nc-accent bg-blue-50 dark:bg-blue-900/30 px-2 py-0.5 rounded mt-1 inline-block">${escola ? escola.nome : ''}</span>`;
                    } else if (infoExtra === 'aluno') {
                        const turma = window.dbLocal.turmas.find(t => t.id === item.turmaId);
                        extra = `<span class="text-xs font-medium text-gray-500 dark:text-gray-400 bg-gray-100 dark:bg-slate-700 px-2 py-0.5 rounded mt-1 inline-block">${turma ? turma.nome : ''}</span>`;
                    }
                    
                    ul.innerHTML += `
                        <li class="p-3 bg-gray-50 dark:bg-slate-800/50 rounded-lg flex justify-between items-center border border-gray-100 dark:border-slate-700 hover:border-gray-200 dark:hover:border-slate-600 transition-colors mb-2">
                            <div class="flex flex-col">
                                <span class="text-sm font-semibold text-nc-text dark:text-slate-200">${item.nome}</span>
                                <div>${extra}</div>
                            </div>
                            <button onclick="window.remover('${tabela}', ${item.id})" class="text-gray-400 hover:text-red-500 p-1 transition-colors" title="Remover">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </li>`;
                });
            };

            renderLista('escolas', 'lista-escolas', window.dbLocal.escolas);
            renderLista('materias', 'lista-materias', window.dbLocal.materias);

            const escolaFiltro = document.getElementById('escola-turma').value;
            let turmasFiltradas = window.dbLocal.turmas;
            if (escolaFiltro) {
                turmasFiltradas = turmasFiltradas.filter(t => t.escolaId == escolaFiltro);
            }
            renderLista('turmas', 'lista-turmas', turmasFiltradas, 'turma');

            const turmaFiltro = document.getElementById('turma-aluno').value;
            let alunosFiltrados = window.dbLocal.alunos;
            if (turmaFiltro) {
                alunosFiltrados = alunosFiltrados.filter(a => a.turmaId == turmaFiltro);
            }
            renderLista('alunos', 'lista-alunos', alunosFiltrados, 'aluno');
        };

        window.atualizarSelects = function() {
            const preencher = (selectId, dados, placeholder) => {
                const select = document.getElementById(selectId);
                const valorAtual = select.value;
                select.innerHTML = `<option value="">${placeholder}</option>`;
                dados.forEach(item => {
                    let extra = '';
                    if(selectId === 'select-turma-diario' || selectId === 'turma-aluno') {
                        const escola = window.dbLocal.escolas.find(e => e.id === item.escolaId);
                        extra = escola ? ` - ${escola.nome}` : '';
                    }
                    select.innerHTML += `<option value="${item.id}">${item.nome}${extra}</option>`;
                });
                if (dados.find(d => d.id == valorAtual)) select.value = valorAtual;
                else if (dados.length > 0 && selectId === 'select-turma-diario') select.value = dados[0].id;
            };
            
            preencher('escola-turma', window.dbLocal.escolas, 'Todas as Escolas (Filtro)...');
            preencher('turma-aluno', window.dbLocal.turmas, 'Todas as Turmas (Filtro)...');
            preencher('select-turma-diario', window.dbLocal.turmas, 'Selecione uma turma para carregar...');
        };

        window.formatarData = function(dataString) {
            const [ano, mes, dia] = dataString.split('-');
            const dataObj = new Date(ano, mes - 1, dia);
            const diasSemana = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
            return `<div class="font-bold text-[13px]">${dia}/${mes}</div><div class="text-[11px] font-normal mt-0.5">${diasSemana[dataObj.getDay()]}</div>`;
        };

        let turmaAtualId = null;

        window.renderPlanilha = function() {
            const turmaSelect = document.getElementById('select-turma-diario').value;
            const mesSelect = document.getElementById('input-mes-diario').value; 
            
            if (!turmaSelect) {
                document.getElementById('tabela-diario').innerHTML = `<tr><td class="p-10 text-center text-gray-500 dark:text-gray-400">Nenhuma turma selecionada.</td></tr>`;
                return;
            }

            turmaAtualId = parseInt(turmaSelect);
            const turma = window.dbLocal.turmas.find(t => t.id === turmaAtualId);
            const escola = window.dbLocal.escolas.find(e => e.id === turma.escolaId);
            const materia = window.dbLocal.materias.length > 0 ? window.dbLocal.materias[0] : {nome: 'CURSO'};
            
            const alunosTurma = window.dbLocal.alunos.filter(a => a.turmaId === turmaAtualId);
            const aulas = window.dbLocal.aulas.filter(a => {
                if (a.turmaId !== turmaAtualId) return false;
                if (mesSelect) return a.data.startsWith(mesSelect);
                return true;
            }).sort((a, b) => a.data.localeCompare(b.data));

            const nomeMes = mesSelect ? new Date(mesSelect + '-01T00:00:00').toLocaleDateString('pt-BR', {month: 'long', year: 'numeric'}) : 'Todas as datas';
            const mesFormatado = nomeMes.charAt(0).toUpperCase() + nomeMes.slice(1).replace(' de ', ' ');

            let html = `
                <thead>
                    <tr><th colspan="${aulas.length + 3}" class="bg-nc-primary text-white p-3 text-center text-xl tracking-wide border-b-[6px] border-nc-accent font-semibold">NEW CODE &middot; Lista de Presença</th></tr>
                    <tr><th colspan="${aulas.length + 3}" class="bg-nc-primary text-white p-2 text-center text-sm font-medium border-b border-gray-600/50">${mesFormatado} &mdash; ${escola ? escola.nome : ''}</th></tr>
                    <tr><th colspan="${aulas.length + 3}" class="bg-nc-primary text-gray-300 p-1.5 text-center text-xs font-normal border-b-[6px] border-nc-accent tracking-wide">${materia.nome} &middot; ${turma.nome}</th></tr>
                    <tr><th class="bg-nc-primary text-white p-3 text-left w-64 text-sm font-bold tracking-wider border-r border-gray-600/30">ALUNO</th>
            `;

            aulas.forEach(aula => {
                html += `<th class="bg-nc-primary text-white p-2 w-16 text-center border-r border-gray-600/30 cursor-pointer hover:bg-nc-primary-hover transition-colors" title="${aula.conteudo || 'Editar'}" onclick="window.editarAula(${aula.id})">${window.formatarData(aula.data)}</th>`;
            });

            html += `
                        <th class="bg-nc-p-header text-white p-2 w-20 text-center text-sm font-bold border-r border-gray-600/30">Total P</th>
                        <th class="bg-nc-f-header text-white p-2 w-20 text-center text-sm font-bold">Total F</th>
                    </tr>
                </thead>
                <tbody class="bg-white dark:bg-slate-800">
            `;

            if (alunosTurma.length === 0) {
                html += `<tr><td colspan="${aulas.length + 3}" class="p-6 text-center text-gray-500">Sem alunos.</td></tr>`;
            }

            alunosTurma.forEach((aluno, index) => {
                const bgClass = index % 2 === 0 ? 'bg-white dark:bg-slate-800' : 'bg-nc-row-alt dark:bg-slate-700/50';
                let totalP = 0, totalF = 0;

                html += `<tr class="${bgClass} hover:bg-blue-50/50 dark:hover:bg-slate-700 transition-colors"><td class="p-2.5 font-medium text-nc-text dark:text-slate-200 border-b border-r border-gray-200 dark:border-slate-600 text-[13px] whitespace-nowrap">${aluno.nome}</td>`;

                aulas.forEach(aula => {
                    const chave = `${aula.id}_${aluno.id}`;
                    const status = window.dbLocal.presencas[chave] || '';
                    if (status === 'P') totalP++;
                    if (status === 'F') totalF++;
                    let textClass = status === 'P' ? 'status-p' : (status === 'F' ? 'status-f' : 'text-gray-400');

                    html += `<td class="p-0 border-b border-r border-gray-200 dark:border-slate-600">
                                <select class="select-status ${textClass} hover:bg-gray-100/50 dark:hover:bg-slate-600/50" onchange="window.registrarPresenca(${aula.id}, ${aluno.id}, this.value)">
                                    <option value="" ${status === '' ? 'selected' : ''}></option>
                                    <option value="P" ${status === 'P' ? 'selected' : ''}>P</option>
                                    <option value="F" ${status === 'F' ? 'selected' : ''}>F</option>
                                </select>
                             </td>`;
                });

                html += `<td class="p-2 border-b border-r border-gray-300 dark:border-slate-600 bg-nc-p-cell dark:bg-[#2c4c34] text-center font-bold text-nc-text dark:text-green-300">${totalP}</td>
                         <td class="p-2 border-b border-gray-300 dark:border-slate-600 bg-nc-f-cell dark:bg-[#5c2b2b] text-center font-bold text-nc-text dark:text-red-300">${totalF}</td></tr>`;
            });

            for(let i=0; i<3; i++) {
                const bgClass = (alunosTurma.length + i) % 2 === 0 ? 'bg-white dark:bg-slate-800' : 'bg-nc-row-alt dark:bg-slate-700/50';
                html += `<tr class="${bgClass} h-10"><td class="border-b border-r border-gray-200 dark:border-slate-600"></td>`;
                aulas.forEach(() => { html += `<td class="border-b border-r border-gray-200 dark:border-slate-600"></td>`; });
                html += `<td class="border-b border-r border-gray-300 dark:border-slate-600 bg-nc-p-cell dark:bg-[#2c4c34] text-center font-bold text-nc-text dark:text-green-300">0</td>
                         <td class="border-b border-gray-300 dark:border-slate-600 bg-nc-f-cell dark:bg-[#5c2b2b] text-center font-bold text-nc-text dark:text-red-300">0</td></tr>`;
            }

            html += `</tbody>`;
            document.getElementById('tabela-diario').innerHTML = html;
        };

        window.registrarPresenca = function(aulaId, alunoId, status) {
            window.dbLocal.presencas[`${aulaId}_${alunoId}`] = status;
            window.salvarDados(); 
        };

        window.adicionarAula = function() {
            if (!turmaAtualId) return window.mostrarToast('Selecione uma turma antes.', 'erro');
            document.getElementById('modal-data').value = '';
            document.getElementById('modal-conteudo').value = '';
            document.getElementById('modal-aula').dataset.aulaId = '';
            document.getElementById('modal-aula').classList.remove('hidden');
        };

        window.editarAula = function(id) {
            const aula = window.dbLocal.aulas.find(a => a.id === id);
            if(!aula) return;
            document.getElementById('modal-data').value = aula.data;
            document.getElementById('modal-conteudo').value = aula.conteudo;
            document.getElementById('modal-aula').dataset.aulaId = aula.id;
            document.getElementById('modal-aula').classList.remove('hidden');
        };

        window.fecharModal = function() {
            document.getElementById('modal-aula').classList.add('hidden');
        };

        window.salvarAula = function() {
            const data = document.getElementById('modal-data').value;
            const conteudo = document.getElementById('modal-conteudo').value;
            const aulaId = document.getElementById('modal-aula').dataset.aulaId;

            if(!data) return window.mostrarToast('A data é obrigatória.', 'erro');

            if(aulaId) {
                const aula = window.dbLocal.aulas.find(a => a.id === parseInt(aulaId));
                aula.data = data;
                aula.conteudo = conteudo;
            } else {
                window.dbLocal.aulas.push({ id: window.gerarId(), turmaId: turmaAtualId, data, conteudo });
            }
            window.salvarDados();
            window.fecharModal();
        };

        // ================= TEMA DARK/LIGHT =================
        window.initTheme = function() {
            const savedTheme = localStorage.getItem('newcode_theme') || 'dark';
            if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
                document.getElementById('icon-sun').classList.remove('hidden');
                document.getElementById('icon-moon').classList.add('hidden');
            } else {
                document.documentElement.classList.add('dark');
                document.getElementById('icon-moon').classList.remove('hidden');
                document.getElementById('icon-sun').classList.add('hidden');
            }
        };

        window.toggleTheme = function() {
            const isDark = document.documentElement.classList.contains('dark');
            if (isDark) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('newcode_theme', 'light');
                document.getElementById('icon-sun').classList.remove('hidden');
                document.getElementById('icon-moon').classList.add('hidden');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('newcode_theme', 'dark');
                document.getElementById('icon-moon').classList.remove('hidden');
                document.getElementById('icon-sun').classList.add('hidden');
            }
        };

        window.initTheme();
    </script>
</body>
</html>
